<!DOCTYPE html>
<html lang="zh-CN">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简历面试助手 - Demo（已接后端 API）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .app { display: flex; min-height: 100vh; }

<body>
<div class="app">
  <aside class="sidebar">
    <h2>简历面试助手</h2>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>

<script>
/** 一级分类固定，AI 填二三级（Demo 预置） */
const L1_TAGS = ['行为面试', '技术', '业务理解', '协作沟通', '职业规划'];

const NAV = [
  { id: 'experience', label: '① 我的经历库', group: '准备' },
  { id: 'intro', label: '② 自我介绍', group: '准备' },
  { id: 'interview', label: '③ 模拟面试', group: '练习' },
  { id: 'notebook', label: '④ 面试笔记本', group: '归档' },
  { id: 'knowledge', label: '⑤ 知识汇总', group: '归档' },
  { id: 'debrief', label: '⑥ 真实面经', group: '归档' },
  { id: 'job', label: '⑦ 岗位定制', group: '定向' },
  { id: 'me', label: '⑧ 我的', group: '账号' },
];

const DELETE_SCOPES = {
  experience: '经历库',
  intro: '自我介绍',
  notebook: '面试笔记本',
  tree: '追问树',
  knowledge: '知识汇总',
  debrief: '真实面经',
  debrief_item: '面经问答',
};

const PROFILE_KEY = 'cv_helper_profile';
const SKIP_DELETE_KEY = 'cv_helper_skip_delete_confirm';

let state = {
  page: 'experience',
  notebookDetailExpId: null,
  knowledgeFilter: null,
  knowledgeEditId: null,
  quiz: null,
  expForm: null,
  addKnowledgeDraft: null,
  introOverlay: '',
  reviewModal: '',
  notebookSearch: '',
  jdText: '',
  jdReport: null,
  loading: null,
  reviewItems: null,
  apiOnline: false,
  apiError: '',
  experiences: [],
  introContent: '您好，我是 CHEN，目前专注于产品方向。曾在 XX 公司担任产品实习生，负责增长模块的数据分析与需求推进，期间主导指标体系建设，助力 DAU 提升 12%。我擅长用数据驱动决策，也具备跨部门协作经验。',
  introVersions: [{ id: 'v1', label: 'AI初稿', date: '2026-08-20', content: '' }],
  knowledge: [],
  debriefs: [],
  debriefDetailId: null,
  debriefForm: null,
  resumeParse: null,
  confirmDialog: null,
  profile: { displayName: 'CHEN', targetRole: '', note: '' },
  interview: {
    expId: 'exp_001', phase: 'idle', activeNodeId: null, branchFrom: null,
    currentQ: '', draft: '', mode: null,
  },
};

const MOCK_Q = {
  deep_dive: ['如果选错指标，你怎么发现并纠正？'],
  new_angle: ['从团队协作看，最大收获是什么？'],
  diverge: ['你提到数据驱动，举一个具体例子？'],
};

/* ========== Backend API ========== */
// 经 /ui 打开时与后端同域；直接打开 html 则回落本机 8000
const API_BASE = (location.port === '8000' || location.pathname.indexOf('/ui') === 0)
  ? ''
  : 'http://127.0.0.1:8000';

async function api(path, opts) {
  opts = opts || {};
  const res = await fetch(API_BASE + path, Object.assign({
    headers: { 'Content-Type': 'application/json' },
  }, opts));
  if (!res.ok) {
    let msg = res.status + ' ' + res.statusText;
    try { msg = await res.text(); } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  if (ct.indexOf('application/json') >= 0) return res.json();
  return res.text();
}

function mapExp(e) {
  return {
    id: e.id,
    type: e.type,
    company: e.company,
    title: e.title,
    role: e.role,
    period: e.period,
    summary: e.summary,
    metrics: e.metrics || '',
    extra: e.extra || '',
    tags: e.tags || [],
    qaTree: e.qa_tree || e.qaTree || [],
    missingHint: e.metrics ? undefined : '建议补充量化数据',
  };
}

function mapKnowledge(k) {
  return {
    id: k.id,
    source: k.source_exp_id ? { expId: k.source_exp_id, nodeId: k.source_node_id } : null,
    question: k.question,
    myAnswer: k.my_answer || '',
    referenceAnswer: k.reference_answer || '',
    tags: k.tags || [],
    note: k.note || '',
    status: k.status || '待巩固',
    addedAt: String(k.created_at || '').slice(0, 10),
  };
}

function replaceExp(mapped) {
  const i = state.experiences.findIndex(function (x) { return x.id === mapped.id; });
  if (i >= 0) state.experiences[i] = mapped;
  else state.experiences.unshift(mapped);
}

async function refreshAll() {
  const [exps, know, debriefs, health] = await Promise.all([
    api('/api/experiences'),
    api('/api/knowledge'),
    api('/api/debriefs'),
    api('/api/health'),
  ]);
  state.experiences = exps.map(mapExp);
  state.knowledge = know.map(mapKnowledge);
  state.debriefs = debriefs;
  state.apiOnline = true;
  state.apiError = '';
  state.llmEffective = health.llm_effective || 'mock';
  if (!state.interview.expId && state.experiences.length) {
    state.interview.expId = state.experiences[0].id;
  }
}

/* ========== utils ========== */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2200);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function findNode(tree, id) {
  for (const n of tree) {
    if (n.nodeId === id) return n;
    const f = findNode(n.children || [], id);
    if (f) return f;
  }
  return null;
}

function updateNode(tree, id, patch) {
  return tree.map(n => n.nodeId === id ? { ...n, ...patch } :
    { ...n, children: updateNode(n.children || [], id, patch) });
}

function addChild(tree, parentId, child) {
  return tree.map(n => n.nodeId === parentId ? { ...n, children: [...(n.children || []), child] } :
    { ...n, children: addChild(n.children || [], parentId, child) });
}

function genId(parentId, siblings) {
  if (!parentId) return 'q' + (siblings.length + 1);
  const nums = siblings.map(s => parseInt(s.nodeId.split('.').pop(), 10)).filter(Boolean);
  return parentId + '.' + ((nums.length ? Math.max(...nums) : 0) + 1);
}

function collectNodes(tree) {
  const out = [];
  const walk = (nodes) => (nodes || []).forEach(n => { out.push(n); walk(n.children); });
  walk(tree);
  return out;
}

function countNodes(tree) { return collectNodes(tree).length; }

function summarizeKnowledgeTags(tree) {
  const map = {};
  collectNodes(tree).forEach(n => {
    const tags = n.knowledgeTags || n.labels || [];
    if (!tags.length) return;
    const key = tags.join(' · ');
    map[key] = (map[key] || 0) + 1;
  });
  return Object.entries(map).map(([label, count]) => ({ label, count, parts: label.split(' · ') }));
}

function getExpById(id) { return state.experiences.find(e => e.id === id); }
function getExp() { return getExpById(state.interview.expId); }

function guessKnowledgeTags(question) {
  const q = question || '';
  if (/RAG|向量|embedding|大模型|LLM|AI/i.test(q)) return ['技术', 'AI应用', 'RAG调优'];
  if (/后端|接口|数据库|MySQL|Redis/i.test(q)) return ['技术', '后端', '知识库'];
  if (/协作|跨部门|冲突|沟通/i.test(q)) return ['协作沟通', '跨部门'];
  if (/指标|漏斗|增长|数据/i.test(q)) return ['业务理解', '指标设计'];
  if (/介绍|负责|STAR/i.test(q)) return ['行为面试', '项目介绍'];
  return ['行为面试'];
}

/* ========== navigation ========== */
function renderNav() {
  let html = '';
  let lastGroup = '';
  NAV.forEach(n => {
    if (n.group !== lastGroup) {
      html += `<div class="nav-group">${n.group}</div>`;
      lastGroup = n.group;
    }
    const active = state.page === n.id
      || (state.page === 'notebook-detail' && n.id === 'notebook')
      || ((state.page === 'debrief' || state.page === 'debrief-detail') && n.id === 'debrief');
    html += `<button class="${active ? 'active' : ''}" onclick="go('${n.id}')">${n.label}</button>`;
  });
  const p = state.profile || loadProfile();
  const status = state.apiOnline
    ? '<div class="nav-group">API · ' + (state.llmEffective || 'mock') + '</div>'
    : '<div class="nav-group" style="color:#c62828">API 未连接</div>';
  const meChip = '<div class="nav-group">本机 · ' + esc(p.displayName || '未命名') + '</div>';
  document.getElementById('nav').innerHTML = status + html + meChip;
}

function go(page, extra) {
  state.page = page;
  state.notebookDetailExpId = null;
  state.debriefDetailId = null;
  state.debriefForm = null;
  state.quiz = null;
  state.expForm = null;
  state.resumeParse = null;
  if (page === 'interview' && extra) {
    state.interview.expId = extra;
    state.interview.phase = 'idle';
    state.interview.activeNodeId = null;
  }
  if (page === 'notebook-detail' && extra) {
    state.notebookDetailExpId = extra;
  }
  if (page === 'knowledge' && extra) {
    state.knowledgeFilter = extra;
  }
  if (page === 'debrief-detail' && extra) {
    state.debriefDetailId = extra;
  }
  render();
}

function render() {
  renderNav();
  const main = document.getElementById('main');
  const map = {
    experience: renderExperience,
    intro: renderIntro,
    interview: renderInterview,
    notebook: renderNotebook,
    'notebook-detail': renderNotebookDetail,
    knowledge: renderKnowledge,
    debrief: renderDebrief,
    'debrief-detail': renderDebriefDetail,
    job: renderJob,
    me: renderMe,
  };
  main.innerHTML = (map[state.page] || renderExperience)();
  document.getElementById('modal-root').innerHTML =
    (state.loading ? renderLoading() : '') +
    (state.confirmDialog ? renderConfirmDialog() : '') +
    (state.resumeParse ? renderResumeParseModal() : '') +
    (state.addKnowledgeDraft ? renderAddKnowledgeModal() : '') +
    (state.reviewItems ? renderReviewModal() : '') +
    (state.introOverlay || '');
}

function renderLoading() {
  const t = state.loading || '处理中…';
  return `<div class="loading-mask">
    <div class="spinner"></div>
    <div class="loading-text">${esc(t)}</div>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <p class="meta">请稍候，正在调用模型</p>
  </div>`;
}

function showLoading(text) {
  state.loading = text || '处理中…';
  render();
}

function hideLoading() {
  state.loading = null;
}

/* ========== 删除确认（按模块隔离；「今日内跳过」存 localStorage，跨日失效） ========== */

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function loadSkipMap() {
  try {
    const raw = localStorage.getItem(SKIP_DELETE_KEY);
    if (!raw) return {};
    const obj = JSON.parse(raw);
    // 旧格式 { date: "YYYY-MM-DD" } → 丢弃，避免全局误伤其它模块
    if (obj && typeof obj.date === 'string' && !Object.keys(DELETE_SCOPES).some(function (k) { return k in obj; })) {
      localStorage.removeItem(SKIP_DELETE_KEY);
      return {};
    }
    return obj && typeof obj === 'object' ? obj : {};
  } catch (e) {
    return {};
  }
}

function shouldSkipDeleteConfirm(scope) {
  if (!scope) return false;
  const map = loadSkipMap();
  return map[scope] === todayStr();
}

function setSkipDeleteConfirmToday(scope) {
  if (!scope) return;
  const map = loadSkipMap();
  map[scope] = todayStr();
  localStorage.setItem(SKIP_DELETE_KEY, JSON.stringify(map));
}

function clearSkipDeleteConfirm(scope) {
  const map = loadSkipMap();
  if (scope) delete map[scope];
  else Object.keys(map).forEach(function (k) { delete map[k]; });
  localStorage.setItem(SKIP_DELETE_KEY, JSON.stringify(map));
}

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return {
      displayName: (obj && obj.displayName) || 'CHEN',
      targetRole: (obj && obj.targetRole) || '',
      note: (obj && obj.note) || '',
    };
  } catch (e) {
    return { displayName: 'CHEN', targetRole: '', note: '' };
  }
}

function saveProfile(partial) {
  const cur = loadProfile();
  const next = Object.assign({}, cur, partial || {});
  localStorage.setItem(PROFILE_KEY, JSON.stringify(next));
  state.profile = next;
}

/**
 * 删除前确认。opts.scope 必填，用于模块隔离跳过。
 * opts: { scope, title, body, dangerLabel }
 */
function confirmDelete(opts) {
  opts = opts || {};
  const scope = opts.scope || 'experience';
  if (shouldSkipDeleteConfirm(scope)) return Promise.resolve(true);
  const scopeLabel = DELETE_SCOPES[scope] || scope;
  return new Promise(function (resolve) {
    state.confirmDialog = {
      scope: scope,
      title: opts.title || '确认删除？',
      body: opts.body || '删除后无法恢复。',
      dangerLabel: opts.dangerLabel || '确认删除',
      scopeLabel: scopeLabel,
      skipChecked: false,
      resolve: resolve,
    };
    render();
  });
}

function renderConfirmDialog() {
  const d = state.confirmDialog;
  if (!d) return '';
  return `<div class="confirm-modal" onclick="if(event.target===this)cancelConfirmDialog()">
    <div class="confirm-panel">
      <h3>${esc(d.title)}</h3>
      <p style="line-height:1.5;color:#444;font-size:13px">${esc(d.body)}</p>
      <label class="confirm-skip">
        <input type="checkbox" id="confirm-skip-today" ${d.skipChecked ? 'checked' : ''} onchange="state.confirmDialog.skipChecked=this.checked" />
        <span>下次直接删除不再提示
          <span class="hint">（仅「${esc(d.scopeLabel)}」今日有效；其它模块仍会确认，明天也会再次确认）</span>
        </span>
      </label>
      <div style="margin-top:16px;text-align:right">
        <button class="btn" onclick="cancelConfirmDialog()">取消</button>
        <button class="btn btn-danger-solid" onclick="acceptConfirmDialog()">${esc(d.dangerLabel)}</button>
      </div>
    </div>
  </div>`;
}

function cancelConfirmDialog() {
  const d = state.confirmDialog;
  state.confirmDialog = null;
  if (d && d.resolve) d.resolve(false);
  render();
}

function acceptConfirmDialog() {
  const d = state.confirmDialog;
  if (!d) return;
  const skipEl = document.getElementById('confirm-skip-today');
  if ((skipEl && skipEl.checked) || d.skipChecked) setSkipDeleteConfirmToday(d.scope);
  state.confirmDialog = null;
  if (d.resolve) d.resolve(true);
  render();
}

function onResumeDrop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag');
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (f) parseResumeFile(f);
}

function onResumeFileSelected(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (f) parseResumeFile(f);
}

async function parseResumeFile(file) {
  const paste = (document.getElementById('resume-paste') || {}).value || '';
  const fd = new FormData();
  fd.append('file', file);
  if (paste.trim()) fd.append('text', paste.trim());
  await runResumeParse(fd);
}

async function parseResumeText() {
  const paste = (document.getElementById('resume-paste') || {}).value || '';
  if (!paste.trim()) { toast('请先粘贴简历文本'); return; }
  const fd = new FormData();
  fd.append('text', paste.trim());
  await runResumeParse(fd);
}

async function runResumeParse(formData) {
  if (!state.apiOnline) { toast('后端未连接'); return; }
  showLoading('正在解析简历…');
  try {
    const res = await fetch(API_BASE + '/api/experiences/parse', { method: 'POST', body: formData });
    if (!res.ok) {
      let msg = res.status + ' ' + res.statusText;
      try { msg = await res.text(); } catch (e) {}
      throw new Error(msg);
    }
    const data = await res.json();
    hideLoading();
    state.resumeParse = {
      items: (data.items || []).map(function (it, i) {
        return Object.assign({}, it, { _selected: true, _idx: i });
      }),
      warning: data.warning || '',
      llm_effective: data.llm_effective || 'mock',
      char_count: data.char_count || 0,
      text_preview: data.text_preview || '',
    };
    toast('解析出 ' + state.resumeParse.items.length + ' 条 · ' + (data.llm_effective || 'mock'));
    render();
  } catch (e) {
    hideLoading();
    toast('解析失败：' + e.message);
    render();
  }
}

async function importParsedExperiences() {
  const p = state.resumeParse;
  if (!p) return;
  const items = p.items.filter(function (x) { return x._selected; }).map(function (x) {
    return {
      type: x.type || '实习',
      company: x.company || '',
      role: x.role || '',
      period: x.period || '',
      summary: x.summary || '',
      metrics: x.metrics || '',
      extra: x.extra || '',
      tags: x.tags || [],
      title: x.title || null,
    };
  });
  if (!items.length) { toast('请至少勾选一条'); return; }
  showLoading('正在导入…');
  try {
    const data = await api('/api/experiences/import', {
      method: 'POST',
      body: JSON.stringify({ items: items }),
    });
    hideLoading();
    state.resumeParse = null;
    await refreshAll();
    toast('已导入 ' + (data.count || items.length) + ' 条经历');
    render();
  } catch (e) {
    hideLoading();
    toast('导入失败：' + e.message);
    render();
  }
}

function aiSuggestExpTags() {
  const company = document.getElementById('f-company').value;
  const summary = document.getElementById('f-summary').value;
  const text = company + ' ' + summary;
  let tags = [];
  if (/数据|分析|指标/i.test(text)) tags.push('数据分析');
  if (/0-1|从零|新建/i.test(text)) tags.push('0-1项目');
  if (/Python|看板|可视化/i.test(text)) tags.push('Python', '可视化');
  if (/产品/i.test(text)) tags.push('产品');
  if (!tags.length) tags = ['待补充'];
  document.getElementById('f-tags').value = tags.join(', ');
  toast('已根据内容生成标签（Demo）');
}

async function saveExpForm() {
  const type = document.getElementById('f-type').value;
  const company = document.getElementById('f-company').value.trim();
  const role = document.getElementById('f-role').value.trim();
  const period = document.getElementById('f-period').value.trim();
  const summary = document.getElementById('f-summary').value.trim();
  const metrics = document.getElementById('f-metrics').value.trim();
  const extra = document.getElementById('f-extra').value.trim();
  const tags = document.getElementById('f-tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);

  if (!company || !role || !period || !summary) {
    toast('请填写带 * 的必填项');
    return;
  }

  const payload = { type, company, role, period, summary, metrics, extra, tags, title: `${company} · ${role}` };
  try {
    if (state.expForm.isNew) {
      const created = await api('/api/experiences', { method: 'POST', body: JSON.stringify(payload) });
      replaceExp(mapExp(created));
      toast('经历已添加（已写入后端）');
    } else {
      const updated = await api('/api/experiences/' + state.expForm.id, {
        method: 'PUT', body: JSON.stringify(payload),
      });
      replaceExp(mapExp(updated));
      toast('经历已更新（已写入后端）');
    }
    state.expForm = null;
    render();
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

async function deleteExperience(expId, scope) {
  const exp = getExpById(expId);
  if (!exp) { toast('经历不存在'); return; }
  const ok = await confirmDelete({
    scope: scope || 'experience',
    title: '删除这段经历？',
    body: '将删除「' + (exp.title || exp.company) + '」及其全部追问树记录，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/experiences/' + expId, { method: 'DELETE' });
    state.experiences = state.experiences.filter(function (e) { return e.id !== expId; });
    if (state.interview.expId === expId) {
      state.interview.expId = state.experiences[0] ? state.experiences[0].id : '';
      state.interview.phase = 'idle';
      state.interview.activeNodeId = null;
    }
    if (state.expForm && state.expForm.id === expId) state.expForm = null;
    if (state.notebookDetailExpId === expId) {
      state.notebookDetailExpId = null;
      state.page = (scope === 'notebook') ? 'notebook' : 'experience';
    }
    toast('经历已删除');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

              <button class="btn" onclick="nextStep('new_angle')" title="同项目换侧面，同级新开一条">换角度（→同级）</button>
              <button class="btn" onclick="nextStep('diverge')" title="抓住上一答里的词追问">发散追问（↓子节点）</button>
              <button class="btn" onclick="nextStep('switch_exp')">换经历</button>
              <button class="btn" onclick="nextStep('end')">结束</button>
            </div>

        `}
      </div>
      <div class="col-right">
        <h4 style="margin-bottom:10px">追问树（点击跳转 & 分支）</h4>
        ${exp.qaTree.length ? renderTree(exp.qaTree, iv.activeNodeId) : '<p class="meta">开始面试后展开</p>'}
        ${node ? `
          <hr class="divider" />
          <button class="btn btn-sm ${node.marks.includes('star')?'btn-active':''}" onclick="toggleMark('star')">⭐ 重点</button>
          <button class="btn btn-sm ${node.marks.includes('practice')?'btn-active':''}" onclick="toggleMark('practice')">✍️ 待练习</button>
          <button class="btn btn-sm ${inKnowledge?'btn-active':''}" onclick="openAddKnowledge('${exp.id}','${node.nodeId}')">
            ${inKnowledge ? '✓ 已在知识汇总' : '📚 加入知识汇总'}
          </button>

}

function renderTree(tree, activeId, depth = 0) {
  return (tree || []).map(n => `
    <div style="margin-left:${depth * 14}px">
      <div class="tree-node ${activeId===n.nodeId?'active':''}" onclick="selectNode('${n.nodeId}')">
        <div class="tree-label">
          <small style="color:#888">${esc(n.nodeId)}</small> ${esc(n.question.slice(0, 36))}${n.question.length>36?'…':''}
          ${n.answer ? '<span class="badge">已答</span>' : ''}
        </div>
        <button type="button" class="tree-del" title="删除本题及子追问" onclick="event.stopPropagation();deleteTreeNode(state.interview.expId,'${n.nodeId}')">×</button>
      </div>
      ${renderTree(n.children, activeId, depth + 1)}
    </div>`).join('');
}

async function deleteTreeNode(expId, nodeId) {
  const exp = getExpById(expId);
  const node = exp ? findNode(exp.qaTree, nodeId) : null;
  if (!node) { toast('节点不存在'); return; }
  const childCount = countSubtreeNodes(node) - 1;
  const ok = await confirmDelete({
    scope: 'tree',
    title: '删除这道题？',
    body: '将删除「' + nodeId + '」' + (childCount > 0 ? '及其 ' + childCount + ' 个子追问' : '') + '，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/interview/' + expId + '/nodes/' + encodeURIComponent(nodeId), { method: 'DELETE' });
    const full = await api('/api/experiences/' + expId);
    const mapped = mapExp(full);
    replaceExp(mapped);
    const iv = state.interview;
    if (iv.expId === expId && !findNode(mapped.qaTree, iv.activeNodeId)) {
      iv.activeNodeId = null;
      iv.phase = 'idle';
      iv.currentQ = '';
      iv.draft = '';
      iv.mode = null;
      iv.branchFrom = null;
    }
    toast('已删除 ' + nodeId);
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

function countSubtreeNodes(node) {
  let n = 1;
  (node.children || []).forEach(function (c) { n += countSubtreeNodes(c); });
  return n;
}

async function startInterview() {
  const iv = state.interview;
  try {
    toast('请求中…');
    const data = await api('/api/interview/' + iv.expId + '/start', { method: 'POST', body: '{}' });
    const full = await api('/api/experiences/' + iv.expId);
    replaceExp(mapExp(full));
    iv.activeNodeId = data.active_node_id;
    iv.currentQ = data.question;
    iv.phase = data.phase;
    iv.draft = (data.node && data.node.answer) || '';
    iv.branchFrom = null;
    iv.mode = null;
    render();
  } catch (e) {
    toast('开始失败：' + e.message);
  }
}

function selectNode(id) {
  const exp = getExp();
  const n = findNode(exp.qaTree, id);
  if (!n) return;
  const iv = state.interview;
  iv.activeNodeId = id; iv.currentQ = n.question; iv.draft = n.answer || '';
  iv.branchFrom = id; iv.mode = n.answerMode || null;
  iv.phase = n.answer ? 'feedback' : 'question';
  render();
}

async function pickMode(mode) {
  const iv = state.interview;
  iv.mode = mode;
  iv.phase = 'answering';
  if (mode === 'user_answered') {
    iv.draft = '';
    render();
    return;
  }
  if (!iv.activeNodeId) { toast('请先开始提问'); return; }
  try {
    showLoading(mode === 'ai_generated' ? 'AI 正在按本题生成参考答案…' : 'AI 正在生成答题框架…');
    const data = await api('/api/interview/' + iv.expId + '/draft', {
      method: 'POST',
      body: JSON.stringify({ node_id: iv.activeNodeId, mode }),
    });
    iv.draft = data.draft || '';
    hideLoading();
    render();
  } catch (e) {
    hideLoading();
    toast('生成失败：' + e.message);
    render();
  }
}

async function submitAnswer() {
  const iv = state.interview;
  try {
    const data = await api('/api/interview/' + iv.expId + '/answer', {
      method: 'POST',
      body: JSON.stringify({
        node_id: iv.activeNodeId,
        answer: iv.draft,
        answer_mode: iv.mode || 'user_answered',
      }),
    });
    const full = await api('/api/experiences/' + iv.expId);
    replaceExp(mapExp(full));
    iv.phase = 'feedback';
    iv.branchFrom = iv.activeNodeId;
    render();
    toast(data.ai_feedback ? '已点评并落库' : '已提交');
  } catch (e) {
    toast('提交失败：' + e.message);
  }
}

async function nextStep(action) {
  const iv = state.interview;
  if (action === 'end') { iv.phase = 'idle'; iv.activeNodeId = null; render(); return; }
  if (action === 'switch_exp') {
    const others = state.experiences.filter(e => e.id !== iv.expId);
    if (others.length) { iv.expId = others[0].id; iv.phase = 'idle'; iv.activeNodeId = null; }
    render(); return;
  }
  // 必须以「当前正在看的节点」为基准（不要用可能过期的 branchFrom 优先）
  // 后端：深挖/发散 → 子节点；换角度 → 同级兄弟
  const fromNodeId = iv.activeNodeId || iv.branchFrom;
  if (!fromNodeId) { toast('请先选中一个节点'); return; }
  try {
    const data = await api('/api/interview/' + iv.expId + '/next', {
      method: 'POST',
      body: JSON.stringify({ from_node_id: fromNodeId, action }),
    });
    const full = await api('/api/experiences/' + iv.expId);
    replaceExp(mapExp(full));
    iv.activeNodeId = data.active_node_id;
    iv.currentQ = data.question;
    iv.draft = '';
    iv.mode = null;
    iv.phase = data.phase || 'question';
    iv.branchFrom = data.active_node_id;
    const createdId = (data.new_node && data.new_node.nodeId) || data.active_node_id;
    toast((action === 'new_angle' ? '已同级分叉 → ' : '已向下追问 → ') + createdId);
    render();
  } catch (e) {
    toast('下一步失败：' + e.message);
  }
}

async function toggleMark(m) {
  const exp = getExp();
  const n = findNode(exp.qaTree, state.interview.activeNodeId);
  if (!n) return;
  const marks = n.marks.includes(m) ? n.marks.filter(x => x !== m) : [...n.marks, m];
  try {
    await api('/api/interview/' + exp.id + '/nodes/' + n.nodeId + '/marks', {
      method: 'PATCH',
      body: JSON.stringify({ marks }),
    });
    const full = await api('/api/experiences/' + exp.id);
    replaceExp(mapExp(full));
    render();
  } catch (e) {
    toast('标记失败：' + e.message);
  }
}

/* ========== 加入知识汇总 ========== */
function openAddKnowledge(expId, nodeId, manual) {
  if (manual) {
    state.addKnowledgeDraft = {
      id: null, expId: '', nodeId: '',
      question: '', myAnswer: '', referenceAnswer: '',
      tagsStr: '行为面试', note: '', status: '待巩固',
    };
    render();
    return;
  }
  const existing = state.knowledge.find(k => k.source?.expId === expId && k.source?.nodeId === nodeId);
  if (existing) {
    state.addKnowledgeDraft = {
      id: existing.id,
      expId, nodeId,
      question: existing.question,
      myAnswer: existing.myAnswer || '',
      referenceAnswer: existing.referenceAnswer || '',
      tagsStr: (existing.tags || []).join(' · '),
      note: existing.note || '',
      status: existing.status || '待巩固',
    };
  } else {
    const exp = getExpById(expId);
    const n = findNode(exp.qaTree, nodeId);
    const tags = n.knowledgeTags || guessKnowledgeTags(n.question);
    state.addKnowledgeDraft = {
      id: null, expId, nodeId,
      question: n.question,
      myAnswer: n.answer || '',
      referenceAnswer: n.answerMode === 'ai_generated' ? (n.answer || '') : '',
      tagsStr: tags.join(' · '),
      note: '', status: '待巩固',
    };
  }
  render();
}

      ${d.id ? `<button class="btn btn-danger" onclick="deleteKnowledge('${d.id}')">删除</button>` : ''}
      <button class="btn" onclick="state.addKnowledgeDraft=null;render()">取消</button>
    </div>
  </div>`;
}

async function saveKnowledge() {
  const d = state.addKnowledgeDraft;
  const payload = {
    question: document.getElementById('k-q').value.trim(),
    my_answer: document.getElementById('k-my').value.trim(),
    reference_answer: document.getElementById('k-ref').value.trim(),
    tags: document.getElementById('k-tags').value.split(/[·•,，]/).map(s => s.trim()).filter(Boolean),
    note: document.getElementById('k-note').value.trim(),
    status: document.getElementById('k-status').value,
    source_exp_id: d.expId || null,
    source_node_id: d.nodeId || null,
  };
  if (!payload.question) { toast('问题不能为空'); return; }
  try {
    if (d.id) {
      const updated = await api('/api/knowledge/' + d.id, { method: 'PUT', body: JSON.stringify(payload) });
      const mapped = mapKnowledge(updated);
      const i = state.knowledge.findIndex(k => k.id === d.id);
      if (i >= 0) state.knowledge[i] = mapped;
    } else {
      const created = await api('/api/knowledge', { method: 'POST', body: JSON.stringify(payload) });
      state.knowledge.unshift(mapKnowledge(created));
    }
    state.addKnowledgeDraft = null;
    toast('已保存到知识汇总（后端）');
    render();
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

function openReview() {
  const items = [];
  state.experiences.forEach(exp => {
    collectNodes(exp.qaTree).forEach(n => {
      if (n.marks.includes('practice')) {
        items.push({
          expId: exp.id,
          expTitle: exp.title,
          nodeId: n.nodeId,
          question: n.question,
          oldAnswer: n.answer || '',
          newAnswer: '',
          progress: '',
          stillWeak: '',
        });
      }
    });
  });
  state.reviewItems = items;
  render();
}

function closeReview() {
  state.reviewItems = null;
  render();
}

function renderReviewModal() {
  const items = state.reviewItems || [];
  return `<div class="modal-bg"><div class="modal" onclick="event.stopPropagation()">
    <h3 style="margin-bottom:12px">复习模式 · 待练习（按项目语境）</h3>
    <p class="meta" style="margin-bottom:12px">提交后 AI 会对比上次回答，指出进步与仍可改进处</p>
    ${items.length ? items.map((i, idx) => `<div class="card">
      <small class="meta">${esc(i.expTitle)} · ${esc(i.nodeId)}</small>
      <p><strong>${esc(i.question)}</strong></p>
      <p style="background:#f5f5f5;padding:8px;margin:8px 0;font-size:13px">原答案：${esc(i.oldAnswer || '无')}</p>
      <textarea id="rev-${idx}" placeholder="重新回答…">${esc(i.newAnswer)}</textarea>
      ${i.progress || i.stillWeak ? `
        <div class="feedback" style="margin-top:8px">
          <p><strong>比上次进步：</strong>${esc(i.progress || '—')}</p>
          <p style="margin-top:6px"><strong>还可以更好：</strong>${esc(i.stillWeak || '—')}</p>
        </div>` : ''}
    </div>`).join('') : '<p class="meta">暂无待练习题目。在模拟面试右栏给节点标「待练习」。</p>'}
    <button class="btn btn-primary" onclick="finishReview()">${items.some(i => i.progress) ? '再分析一次' : '提交并请 AI 对比'}</button>
    <button class="btn" onclick="closeReview()">关闭</button>
  </div></div>`;
}

async function finishReview() {
  const items = state.reviewItems || [];
  if (!items.length) { closeReview(); return; }
  items.forEach((i, idx) => {
    const el = document.getElementById('rev-' + idx);
    if (el) i.newAnswer = el.value.trim();
  });
  const todo = items.filter(i => i.newAnswer);
  if (!todo.length) { toast('请至少填写一题再提交'); return; }
  try {
    showLoading('AI 正在对比你和上次的回答…');
    for (const i of todo) {
      const data = await api('/api/interview/' + i.expId + '/review', {
        method: 'POST',
        body: JSON.stringify({ node_id: i.nodeId, new_answer: i.newAnswer }),
      });
      i.progress = data.progress || '';
      i.stillWeak = data.still_weak || '';
    }
    hideLoading();
    render();
    toast('对比完成，请看每题下方点评');
  } catch (e) {
    hideLoading();
    toast('分析失败：' + e.message);
    render();
  }
}

              <button class="btn btn-sm btn-danger" onclick="deleteKnowledge('${k.id}')">删除</button>
            </div>
          </div>
          <div class="chip-row" style="margin-top:8px">
            ${(k.tags||[]).map(t => `<span class="tag tag-l1">${esc(t)}</span>`).join('')}
            <span class="tag">${esc(k.status)}</span>
          </div>
          ${k.myAnswer ? `<p class="meta" style="margin-top:8px">我的回答：${esc(k.myAnswer.slice(0,80))}${k.myAnswer.length>80?'…':''}</p>` : ''}
          ${k.note ? `<p class="meta">笔记：${esc(k.note)}</p>` : ''}
          <p class="meta" style="margin-top:6px">来源：${exp ? esc(exp.title) + ' / ' + esc(k.source.nodeId) : '手动添加'} · ${esc(k.addedAt)}</p>
        </div>`;
    }).join('')}`;
}

async function deleteKnowledge(id) {
  const k = state.knowledge.find(function (x) { return x.id === id; });
  if (!k) { toast('条目不存在'); return; }
  const ok = await confirmDelete({
    scope: 'knowledge',
    title: '删除这条知识？',
    body: '将删除「' + (k.question || '').slice(0, 40) + '」，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/knowledge/' + id, { method: 'DELETE' });
    state.knowledge = state.knowledge.filter(function (x) { return x.id !== id; });
    if (state.addKnowledgeDraft && state.addKnowledgeDraft.id === id) state.addKnowledgeDraft = null;
    toast('知识条目已删除');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

function editKnowledge(id) {
  const k = state.knowledge.find(x => x.id === id);
  if (!k) return;
  state.addKnowledgeDraft = {
    id: k.id,
    expId: k.source?.expId || '',
    nodeId: k.source?.nodeId || '',
    question: k.question,
    myAnswer: k.myAnswer || '',
    referenceAnswer: k.referenceAnswer || '',
    tagsStr: (k.tags || []).join(' · '),
    note: k.note || '',
    status: k.status || '待巩固',
  };
  render();
}

function startQuiz() {
  let pool = state.knowledge;
  if (state.knowledgeFilter) {
    const f = state.knowledgeFilter;
    pool = pool.filter(k => (k.tags || []).join(' · ').includes(f));
  }
  if (!pool.length) { toast('没有可抽查的知识条目'); return; }
  const item = pool[Math.floor(Math.random() * pool.length)];
  state.quiz = { item, revealed: false, answer: '' };
  render();
}

function renderQuiz() {
  const { item, revealed, answer } = state.quiz;
  return `
    <h1 class="page-title">
      <button class="btn btn-ghost btn-sm" onclick="state.quiz=null;render()">← 返回知识汇总</button>

      <p style="font-size:18px;font-weight:600;line-height:1.5;margin-bottom:16px">${esc(item.question)}</p>
      ${!revealed ? `

        <button class="btn btn-primary" style="margin-top:12px" onclick="state.quiz.revealed=true;render()">查看原答案 / 参考</button>

        <button class="btn btn-primary" onclick="state.knowledge.find(k=>k.id==='${item.id}').status='待巩固';startQuiz()">还要练，下一题</button>

function getDebrief() {

function replaceDebrief(d) {

async function deleteDebrief(id) {
  const d = (state.debriefs || []).find(function (x) { return x.id === id; });
  if (!d) { toast('面经不存在'); return; }
  const ok = await confirmDelete({
    scope: 'debrief',
    title: '删除这场面经？',
    body: '将删除「' + (d.title || '未命名面经') + '」及其中全部问答，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/debriefs/' + id, { method: 'DELETE' });
    state.debriefs = state.debriefs.filter(function (x) { return x.id !== id; });
    if (state.debriefDetailId === id) {
      state.debriefDetailId = null;
      state.page = 'debrief';
    }
    toast('面经已删除');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

async function deleteDebriefItem(debriefId, itemId) {
  const d = (state.debriefs || []).find(function (x) { return x.id === debriefId; });
  const it = d && (d.items || []).find(function (i) { return i.id === itemId; });
  if (!it) { toast('条目不存在'); return; }
  const ok = await confirmDelete({
    scope: 'debrief_item',
    title: '删除这条问答？',
    body: '将删除问：「' + (it.question || '').slice(0, 40) + '」，整场面经仍保留。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    const updated = await api('/api/debriefs/' + debriefId + '/items/' + encodeURIComponent(itemId), { method: 'DELETE' });
    replaceDebrief(updated);
    toast('已删除该条问答');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

async function extractDebrief(id) {
  try {
    showLoading('正在从转写中提取问答…');
    const d = await api('/api/debriefs/' + id + '/extract', { method: 'POST', body: '{}' });
    replaceDebrief(d);
    hideLoading();
    render();
    toast('已提取 ' + (d.items || []).length + ' 条');
  } catch (e) {
    hideLoading();
    toast('提取失败：' + e.message);
    render();
  }
}

async function analyzeDebrief(id, itemId) {
  try {
    showLoading(itemId ? 'AI 正在分析本条回答…' : 'AI 正在逐条分析面经，请稍候…');
    const body = itemId ? { item_id: itemId } : {};
    const d = await api('/api/debriefs/' + id + '/analyze', { method: 'POST', body: JSON.stringify(body) });
    replaceDebrief(d);
    hideLoading();
    render();
    const weak = (d.items || []).filter(i => i.quality === 'weak').length;
    toast(itemId ? '本条分析完成' : '分析完成，弱答 ' + weak + ' 条已标红');
  } catch (e) {
    hideLoading();
    toast('分析失败：' + e.message);
    render();
  }
}

async function addWeakToKnowledge(debriefId, itemId) {
  const d = (state.debriefs || []).find(x => x.id === debriefId);
  const it = d && (d.items || []).find(i => i.id === itemId);
  if (!it) { toast('条目不存在'); return; }
  try {
    const created = await api('/api/knowledge', {
      method: 'POST',
      body: JSON.stringify({
        question: it.question,
        my_answer: it.answer || '',
        reference_answer: it.optimized_answer || '',
        tags: it.tags || ['行为面试'],
        note: '来自真实面经：' + (d.title || debriefId),
        status: '待巩固',
      }),
    });
    state.knowledge.unshift(mapKnowledge(created));
    toast('已加入知识汇总');
  } catch (e) {
    toast('入库失败：' + e.message);
  }
}

    toast('分析失败：' + e.message);
    render();
  }
}

function renderJDReport(r) {
  const firstId = (state.experiences[0] && state.experiences[0].id) || '';
  const matches = r.matches || [];
  const gaps = r.gaps || [];
  const actions = r.actions || [];
  return `
    <div class="card" style="margin-top:8px">
      <h3 style="margin-bottom:8px">匹配度报告 <span class="badge">${esc(r.score)}/100</span>
        ${r.llm_effective ? `<span class="badge">${esc(r.llm_effective)}</span>` : ''}
      </h3>
      <div style="height:8px;background:#eee;border-radius:4px;margin-bottom:16px">
        <div style="height:8px;width:${Math.max(0, Math.min(100, Number(r.score) || 0))}%;background:#1a56db;border-radius:4px"></div>
      </div>
      <h4 class="match-ok" style="margin-bottom:8px">✓ 匹配点</h4>
      ${matches.length ? matches.map(m => `<p style="margin-bottom:6px"><strong>${esc(m.exp)}</strong> — ${esc(m.point)}</p>`).join('') : '<p class="meta">暂无</p>'}
      <hr class="divider" />
      <h4 class="match-gap" style="margin-bottom:8px">△ 缺口 / 短板</h4>
      ${gaps.length ? gaps.map(g => `<p style="margin-bottom:6px"><strong>${esc(g.skill)}</strong> — ${esc(g.tip)}</p>`).join('') : '<p class="meta">暂无</p>'}
      <hr class="divider" />
      <h4 class="match-tip" style="margin-bottom:8px">→ 建议行动</h4>
      ${actions.length ? actions.map(a => `<p style="margin-bottom:6px"><span class="tag">${esc(a.type)}</span> ${esc(a.text)}</p>`).join('') : '<p class="meta">暂无</p>'}
      <div style="margin-top:16px">
        ${firstId ? `<button class="btn btn-primary" onclick="go('interview','${firstId}')">按建议去练经历</button>` : ''}
        <button class="btn" onclick="go('knowledge')">去知识汇总巩固</button>
      </div>
    </div>`;
}

/* boot */
state.profile = loadProfile();
state.introVersions[0].content = state.introContent;
render();
(async function boot() {
  try {
    await refreshAll();
    toast('已连接后端 · LLM=' + (state.llmEffective || 'mock'));
    render();
  } catch (e) {
    state.apiOnline = false;
    state.apiError = String(e.message || e);
    render();
    toast('后端未连接：请先启动 uvicorn（端口 8000）');
  }
})();
</script>
</body>
</html>
