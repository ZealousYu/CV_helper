function debriefTranscriptTip(openByDefault) {
  return `
    <details class="tip-box" ${openByDefault ? 'open' : ''}>
      <summary>面试录音文本如何获取？</summary>
      <ol>
        <li>面试时开启<strong>手机自带录音机</strong>（多数机型可后台录音）。</li>
        <li>结束后用系统自带的<strong>转文字 / 转录</strong>（一般免费），复制全文。</li>
        <li>粘贴到下方输入框；建议整理成「面试官：… / 候选人：…」方便提取。</li>
      </ol>
      <p class="meta" style="margin-top:8px">本产品专注归档与弱答分析，暂不内置录音转写；用系统工具即可。</p>
      <p class="meta" style="margin-top:4px">长度说明：整场粘贴可入库；真模型提取时默认只分析约前 2 万字（可在 .env 用 LLM_TRANSCRIPT_MAX_CHARS 调整），过长可先删寒暄/自我介绍重复段。</p>
    </details>`;
}

function renderDebrief() {
  if (state.debriefForm) return renderDebriefForm();
  return `
    <h1 class="page-title">${renderHubBack('review')}面试经历</h1>
    <p class="page-lead">粘贴真实面试转写，自动提取问答，标出弱答，并给出准确性、深度、逻辑、表达四维评分。</p>
    ${debriefTranscriptTip(!(state.debriefs || []).length)}
    <button class="btn btn-primary" onclick="openDebriefForm()">＋ 录入面试转写</button>
    ${!(state.debriefs || []).length ? '<div class="empty">还没有面试经历，先录入一段转写文本</div>' : ''}
    ${(state.debriefs || []).map(d => {
      const items = d.items || [];
      const weak = items.filter(i => i.quality === 'weak').length;
      const analyzed = items.filter(i => i.quality === 'good' || i.quality === 'weak').length;
      const scoreSum = debriefScoreSummary(items);
      return `
        <div class="list-row" onclick="go('debrief-detail','${d.id}')">
          <div>
            <strong>${esc(d.title || '未命名面试经历')}</strong>
            ${scoreSum ? `<span class="badge">${scoreSum.avg}/100 均分</span>` : ''}
            <div class="meta" style="margin-top:4px">${esc(d.company || '')} ${esc(d.role || '')} ${esc(d.interview_date || '')}</div>
            <div class="meta">${items.length} 条问答 · 已分析 ${analyzed} · 弱答 ${weak}${scoreSum ? ' · 已评分 ' + scoreSum.count : ''}</div>
          </div>
          <div class="row-actions" onclick="event.stopPropagation()">
            <button class="btn btn-sm btn-danger" onclick="deleteDebrief('${d.id}')">删除</button>
            <span class="meta">详情 →</span>
          </div>
        </div>`;
    }).join('')}`;
}

function openDebriefForm() {
  state.debriefForm = { title: '', company: '', role: '', interview_date: '', transcript: '' };
  render();
}

function renderDebriefForm() {
  const f = state.debriefForm;
  return `
    <h1 class="page-title">
      <button class="btn btn-ghost btn-sm" onclick="state.debriefForm=null;render()">← 返回</button>
      录入面试转写
    </h1>
    ${debriefTranscriptTip(true)}
    <div class="card">
      <div class="form-grid">
        <div class="form-row"><label>标题</label><input type="text" id="db-title" value="${esc(f.title)}" placeholder="如：字节一轮 · 产品" /></div>
        <div class="form-row"><label>公司</label><input type="text" id="db-company" value="${esc(f.company)}" /></div>
        <div class="form-row"><label>岗位</label><input type="text" id="db-role" value="${esc(f.role)}" /></div>
        <div class="form-row"><label>日期</label><input type="text" id="db-date" value="${esc(f.interview_date)}" placeholder="2026-08-30" /></div>
      </div>
      <div class="form-row">
        <label>转写文本 * <span class="hint">建议格式：面试官：… / 候选人：…</span></label>
        <textarea id="db-transcript" style="min-height:220px" placeholder="${esc(SAMPLE_TRANSCRIPT)}">${esc(f.transcript)}</textarea>
      </div>
      <button class="btn btn-sm" type="button" onclick="fillSampleTranscript()">填入示例文本</button>
      <button class="btn btn-primary" onclick="saveDebrief()">保存并提取问答</button>
      <button class="btn" onclick="state.debriefForm=null;render()">取消</button>
    </div>`;
}

function fillSampleTranscript() {
  const el = document.getElementById('db-transcript');
  if (el) el.value = SAMPLE_TRANSCRIPT;
}

async function saveDebrief() {
  const payload = {
    title: document.getElementById('db-title').value.trim(),
    company: document.getElementById('db-company').value.trim(),
    role: document.getElementById('db-role').value.trim(),
    interview_date: document.getElementById('db-date').value.trim(),
    transcript: document.getElementById('db-transcript').value.trim(),
  };
  if (!payload.transcript) { toast('请粘贴转写文本'); return; }
  try {
    showLoading('保存并提取问答中…');
    const created = await api('/api/debriefs', { method: 'POST', body: JSON.stringify(payload) });
    const extracted = await api('/api/debriefs/' + created.id + '/extract', { method: 'POST', body: '{}' });
    state.debriefs.unshift(extracted);
    state.debriefForm = null;
    hideLoading();
    go('debrief-detail', extracted.id);
    toast('已提取 ' + (extracted.items || []).length + ' 条问答');
  } catch (e) {
    hideLoading();
    toast('失败：' + e.message);
    render();
  }
}

function getDebrief() {
  return (state.debriefs || []).find(d => d.id === state.debriefDetailId);
}

function replaceDebrief(d) {
  const i = state.debriefs.findIndex(x => x.id === d.id);
  if (i >= 0) state.debriefs[i] = d;
  else state.debriefs.unshift(d);
}

function renderDebriefDetail() {
  const d = getDebrief();
  if (!d) return `<div class="empty">未找到面试经历 <button class="btn" onclick="go('debrief')">返回</button></div>`;
  const items = d.items || [];
  const weakN = items.filter(i => i.quality === 'weak').length;
  const scoreSum = debriefScoreSummary(items);
  return `
    <h1 class="page-title">
      <button class="btn btn-ghost btn-sm" onclick="go('debrief')">← 面试经历列表</button>
      ${esc(d.title)}
    </h1>
    <div class="summary-bar">
      <div class="meta">${esc(d.company)} · ${esc(d.role)} · ${esc(d.interview_date)}</div>
      ${scoreSum ? `
        <div style="margin-top:10px">
          <strong>量化评分</strong>
          <span class="meta" style="margin-left:8px">${scoreSum.count}/${scoreSum.total} 条已评 · 均分 ${scoreSum.avg}/100</span>
          <div class="score-row" style="margin-top:8px">
            <span class="score-num">${scoreSum.avg}</span><span class="meta">/100 本场均分</span>
            <div class="score-bar"><i style="width:${Math.max(0, Math.min(100, scoreSum.avg))}%"></i></div>
          </div>
        </div>` : '<p class="meta" style="margin-top:8px">分析后将显示四维评分与综合分</p>'}
      <div style="margin-top:8px">
        <button class="btn btn-sm" onclick="extractDebrief('${d.id}')">重新提取问答</button>
        <button class="btn btn-primary btn-sm" onclick="analyzeDebrief('${d.id}')">AI 分析并评分</button>
        <button class="btn btn-sm btn-danger" onclick="deleteDebrief('${d.id}')">删除整场面试经历</button>
        <span class="meta" style="margin-left:8px">${items.length} 条 · 弱答 ${weakN}（标红）</span>
      </div>
    </div>
    <details class="card">
      <summary>原始转写文本</summary>
      <pre style="white-space:pre-wrap;font-size:13px;margin-top:8px;line-height:1.5">${esc(d.transcript)}</pre>
    </details>
    ${!items.length ? '<div class="empty">尚未提取问答，点上方按钮</div>' : items.map(it => {
      const qclass = it.quality === 'weak' ? 'qa-weak' : (it.quality === 'good' ? 'qa-good' : 'qa-pending');
      const qlabel = it.quality === 'weak' ? '<span class="weak-label">弱答 · 需优化</span>'
        : (it.quality === 'good' ? '<span class="good-label">较好</span>' : '<span class="meta">待分析</span>');
      return `
        <div class="card ${qclass}">
          <div class="flex-between">
            <div>${qlabel}${renderDebriefScoreBadge(it)}</div>
            <div>
              <button class="btn btn-sm" onclick="analyzeDebrief('${d.id}','${it.id}')">分析并评分</button>
              <button class="btn btn-sm btn-danger" onclick="deleteDebriefItem('${d.id}','${it.id}')">删除本条</button>
            </div>
          </div>
          <p style="margin:10px 0 6px"><strong>问：</strong>${esc(it.question)}</p>
          <p style="margin-bottom:8px"><strong>答：</strong>${esc(it.answer)}</p>
          ${(it.tags || []).map(t => `<span class="tag tag-l1">${esc(t)}</span>`).join('')}
          ${debriefItemScore(it) != null ? `<div class="feedback" style="margin-top:10px"><strong>量化评分</strong>${renderScoreBlock(it)}</div>` : ''}
          ${it.analysis ? `<div class="feedback" style="margin-top:10px"><strong>AI 分析</strong>
            <p style="margin-top:6px">${esc(it.analysis)}</p></div>` : ''}
          ${it.optimized_answer && it.quality === 'weak' ? `
            <div class="card" style="margin-top:8px;background:#fff;border-style:dashed">
              <strong>优化回答建议</strong>
              <pre style="white-space:pre-wrap;margin-top:6px;font-size:13px;line-height:1.5">${esc(it.optimized_answer)}</pre>
              <button class="btn btn-sm" style="margin-top:8px" onclick="addWeakToKnowledge('${d.id}','${it.id}')">📚 弱答入库到知识汇总</button>
            </div>` : ''}
        </div>`;
    }).join('')}`;
}

async function deleteDebrief(id) {
  const d = (state.debriefs || []).find(function (x) { return x.id === id; });
  if (!d) { toast('面试经历不存在'); return; }
  const ok = await confirmDelete({
    scope: 'debrief',
    title: '删除这场面试经历？',
    body: '将删除「' + (d.title || '未命名面试经历') + '」及其中全部问答，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/debriefs/' + id, { method: 'DELETE' });
    state.debriefs = state.debriefs.filter(function (x) { return x.id !== id; });
    if (state.debriefDetailId === id) {
      state.debriefDetailId = null;
      state.page = 'debrief';
    }
    toast('面试经历已删除');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

async function deleteDebriefItem(debriefId, itemId) {
  const d = (state.debriefs || []).find(function (x) { return x.id === debriefId; });
  const it = d && (d.items || []).find(function (i) { return i.id === itemId; });
  if (!it) { toast('条目不存在'); return; }
  const ok = await confirmDelete({
    scope: 'debrief_item',
    title: '删除这条问答？',
    body: '将删除问：「' + (it.question || '').slice(0, 40) + '」，整场面试经历仍保留。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    const updated = await api('/api/debriefs/' + debriefId + '/items/' + encodeURIComponent(itemId), { method: 'DELETE' });
    replaceDebrief(updated);
    toast('已删除该条问答');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

async function extractDebrief(id) {
  try {
    showLoading('正在从转写中提取问答…');
    const d = await api('/api/debriefs/' + id + '/extract', { method: 'POST', body: '{}' });
    replaceDebrief(d);
    hideLoading();
    render();
    toast('已提取 ' + (d.items || []).length + ' 条');
  } catch (e) {
    hideLoading();
    toast('提取失败：' + e.message);
    render();
  }
}

async function analyzeDebrief(id, itemId) {
  try {
    showLoading(itemId ? 'AI 正在分析本条回答…' : 'AI 正在逐条分析面试经历，请稍候…');
    const body = itemId ? { item_id: itemId } : {};
    const d = await api('/api/debriefs/' + id + '/analyze', { method: 'POST', body: JSON.stringify(body) });
    replaceDebrief(d);
    hideLoading();
    render();
    const weak = (d.items || []).filter(i => i.quality === 'weak').length;
    toast(itemId ? '本条分析完成' : '分析完成，弱答 ' + weak + ' 条已标红');
  } catch (e) {
    hideLoading();
    toast('分析失败：' + e.message);
    render();
  }
}

async function addWeakToKnowledge(debriefId, itemId) {
  const d = (state.debriefs || []).find(x => x.id === debriefId);
  const it = d && (d.items || []).find(i => i.id === itemId);
  if (!it) { toast('条目不存在'); return; }
  try {
    const created = await api('/api/knowledge', {
      method: 'POST',
      body: JSON.stringify({
        question: it.question,
        my_answer: it.answer || '',
        reference_answer: it.optimized_answer || '',
        tags: it.tags || ['行为面试'],
        note: '来自面试经历：' + (d.title || debriefId),
        status: '待巩固',
      }),
    });
    state.knowledge.unshift(mapKnowledge(created));
    toast('已加入知识汇总');
  } catch (e) {
    toast('入库失败：' + e.message);
  }
}

/* ========== ⑧ 我的（本机资料卡，不是登录账号） ========== */
function renderMe() {
  const p = state.profile || loadProfile();
  const skipMap = loadSkipMap();
  const today = todayStr();
  const qaCount = state.experiences.reduce(function (n, e) { return n + countNodes(e.qaTree || []); }, 0);
  const skipRows = Object.keys(DELETE_SCOPES).map(function (scope) {
    const on = skipMap[scope] === today;
    return `<div class="flex-between" style="padding:8px 0;border-bottom:1px solid #eee">
      <div>
        <strong>${esc(DELETE_SCOPES[scope])}</strong>
        <div class="meta">${on ? '今日删除不再确认' : '删除前会确认'}</div>
      </div>
      ${on ? `<button class="btn btn-sm" onclick="clearSkipDeleteConfirm('${scope}');toast('已恢复「${DELETE_SCOPES[scope]}」删除确认');render()">恢复确认</button>` : '<span class="meta">未跳过</span>'}
    </div>`;
  }).join('');
  return `
    <h1 class="page-title">我的</h1>
    <p class="page-lead">当前没有账号登录。这里是本机资料卡：称呼只保存在这台电脑的浏览器里；练习数据仍在本地数据库中。</p>
    <div class="card">
      <div class="form-grid">
        <div class="form-row">
          <label>称呼</label>
          <input type="text" id="me-name" value="${esc(p.displayName || '')}" placeholder="怎么称呼你" />
        </div>
        <div class="form-row">
          <label>目标岗位</label>
          <input type="text" id="me-role" value="${esc(p.targetRole || '')}" placeholder="如：产品经理 / 后端实习" />
        </div>
      </div>
      <div class="form-row">
        <label>备注</label>
        <textarea id="me-note" style="min-height:64px" placeholder="求职阶段、城市等">${esc(p.note || '')}</textarea>
      </div>
      <button class="btn btn-primary" onclick="saveMeForm()">保存资料卡</button>
    </div>
    <div class="summary-bar">
      <strong>本机数据概览</strong>
      <p class="meta" style="margin-top:8px">
        经历 ${state.experiences.length} 段 · 追问节点 ${qaCount} · 知识 ${state.knowledge.length} 条 · 面试经历 ${(state.debriefs || []).length} 场
      </p>
      <p class="meta" style="margin-top:4px">后端 LLM：${esc(state.llmEffective || (state.apiOnline ? '未知' : '未连接'))}</p>
    </div>
    <div class="card">
      <strong>删除确认偏好（按模块、仅今日）</strong>
      <p class="meta" style="margin:8px 0 4px">在某个模块勾选「下次不再提示」只影响该模块；明天自动失效。</p>
      ${skipRows}
      <button class="btn btn-sm" style="margin-top:12px" onclick="clearSkipDeleteConfirm();toast('已恢复全部模块的删除确认');render()">全部恢复确认</button>
    </div>
  `;
}

function saveMeForm() {
  saveProfile({
    displayName: (document.getElementById('me-name').value || '').trim() || 'CHEN',
    targetRole: (document.getElementById('me-role').value || '').trim(),
    note: (document.getElementById('me-note').value || '').trim(),
  });
  toast('资料卡已保存在本机浏览器');
  render();
}

/* ========== ⑦ 岗位定制 ========== */
function renderJob() {
  return `
    <h1 class="page-title">岗位匹配</h1>
    <p class="page-lead">粘贴目标岗位说明，对照经历库分析匹配度与待补短板。</p>
    <div class="card">
      <div class="form-row">
        <label>目标岗位说明</label>
        <textarea id="jd-text" style="min-height:140px" placeholder="粘贴岗位职责、任职要求…">${esc(state.jdText)}</textarea>
      </div>
      <button class="btn btn-primary" onclick="analyzeJD()">分析匹配度</button>
    </div>
    ${state.jdReport ? renderJDReport(state.jdReport) : ''}`;
}

async function analyzeJD() {
  const el = document.getElementById('jd-text');
  state.jdText = el ? el.value : state.jdText;
  try {
    showLoading('AI 正在对照你的经历分析 JD…');
    const data = await api('/api/job/match', {
      method: 'POST',
      body: JSON.stringify({ jd_text: state.jdText || '' }),
    });
    state.jdReport = data;
    hideLoading();
    render();
    toast(data.llm_effective === 'openai' ? '匹配分析完成' : '当前仍为 Mock（未读到 Key）');
  } catch (e) {
    hideLoading();
    toast('分析失败：' + e.message);
    render();
  }
}

function renderJDReport(r) {
  const firstId = (state.experiences[0] && state.experiences[0].id) || '';
  const matches = r.matches || [];
  const gaps = r.gaps || [];
  const actions = r.actions || [];
  return `
    <div class="card" style="margin-top:8px">
      <h3 style="margin-bottom:8px">匹配度报告 <span class="badge">${esc(r.score)}/100</span>
        ${r.llm_effective ? `<span class="badge">${esc(r.llm_effective)}</span>` : ''}
      </h3>
      <div style="height:8px;background:#eee;border-radius:4px;margin-bottom:16px">
        <div style="height:8px;width:${Math.max(0, Math.min(100, Number(r.score) || 0))}%;background:#1a56db;border-radius:4px"></div>
      </div>
      <h4 class="match-ok" style="margin-bottom:8px">✓ 匹配点</h4>
      ${matches.length ? matches.map(m => `<p style="margin-bottom:6px"><strong>${esc(m.exp)}</strong> — ${esc(m.point)}</p>`).join('') : '<p class="meta">暂无</p>'}
      <hr class="divider" />
      <h4 class="match-gap" style="margin-bottom:8px">△ 缺口 / 短板</h4>
      ${gaps.length ? gaps.map(g => `<p style="margin-bottom:6px"><strong>${esc(g.skill)}</strong> — ${esc(g.tip)}</p>`).join('') : '<p class="meta">暂无</p>'}
      <hr class="divider" />
      <h4 class="match-tip" style="margin-bottom:8px">→ 建议行动</h4>
      ${actions.length ? actions.map(a => `<p style="margin-bottom:6px"><span class="tag">${esc(a.type)}</span> ${esc(a.text)}</p>`).join('') : '<p class="meta">暂无</p>'}
      <div style="margin-top:16px">
        ${firstId ? `<button class="btn btn-primary" onclick="go('interview','${firstId}')">按建议去练经历</button>` : ''}
        <button class="btn" onclick="go('knowledge')">去知识汇总巩固</button>
      </div>
    </div>`;
}

/* boot */
state.profile = loadProfile();
state.introVersions[0].content = state.introContent;
render();
(async function boot() {
  try {
    await refreshAll();
    toast('已连接后端 · LLM=' + (state.llmEffective || 'mock'));
    render();
  } catch (e) {
    state.apiOnline = false;
    state.apiError = String(e.message || e);
    render();
    toast('后端未连接：请先启动 uvicorn（端口 8000）');
  }
})();
</script>
