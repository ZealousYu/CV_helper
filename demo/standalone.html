<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简历面试助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* 排版/间距全局统一；主题只改颜色 */
    :root {
      --radius: 10px;
      --font: "Source Sans 3", "Noto Sans SC", sans-serif;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.05);
    }
    :root, [data-theme="warm"] {
      --ink: #2c2824;
      --ink-soft: #5a524a;
      --muted: #8a7f74;
      --line: #e5ddd2;
      --line-strong: #d4c8ba;
      --bg: #f3eee6;
      --bg-glow: #ebe3d6;
      --surface: #fffcf7;
      --surface-2: #f7f1e8;
      --accent: #c4784a;
      --accent-deep: #a86238;
      --accent-soft: #f5ebe3;
      --ok: #5c7a4a;
      --warn: #b07a3a;
      --danger: #a8483e;
      --sidebar-bg: #ebe4da;
      --sidebar-bg-2: #e5ddd2;
      --sidebar-text: #2c2824;
      --sidebar-muted: #8a7f74;
      --sidebar-hover: rgba(44,40,36,.06);
      --sidebar-active-bg: rgba(196,120,74,.14);
      --sidebar-brand: #2c2824;
      --sidebar-border: #d4c8ba;
      --accent-rgb: 196, 120, 74;
      --overlay-scrim: rgba(44,40,36,.4);
      --toast-fg: #fffaf4;
      --input-bg: #fffaf4;
      --danger-soft: #faf0ee;
      --danger-line: #e0b4ae;
      --ok-soft: #f0f4ec;
      --ok-line: #b7c4ab;
    }
    [data-theme="rational"] {
      --ink: #1f2933;
      --ink-soft: #3d4f5f;
      --muted: #5b6b7c;
      --line: #e3e7ec;
      --line-strong: #c5ced8;
      --bg: #f4f5f7;
      --bg-glow: #e8ebf0;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --accent: #3b6d9a;
      --accent-deep: #2f5a80;
      --accent-soft: #e8f0f6;
      --ok: #3d6b52;
      --warn: #9a6b2f;
      --danger: #a34444;
      --sidebar-bg: #eef1f4;
      --sidebar-bg-2: #e8ebf0;
      --sidebar-text: #1f2933;
      --sidebar-muted: #5b6b7c;
      --sidebar-hover: rgba(31,41,51,.06);
      --sidebar-active-bg: rgba(59,109,154,.12);
      --sidebar-brand: #1f2933;
      --sidebar-border: #d5dbe3;
      --accent-rgb: 59, 109, 154;
      --overlay-scrim: rgba(31,41,51,.4);
      --toast-fg: #ffffff;
      --input-bg: #ffffff;
      --danger-soft: #f7ecec;
      --danger-line: #e0b4ae;
      --ok-soft: #eef4ef;
      --ok-line: #b7c4ab;
    }
    [data-theme="night"] {
      color-scheme: dark;
      --ink: #e6e8ec;
      --ink-soft: #c5cad3;
      --muted: #9aa3b0;
      --line: #3a414c;
      --line-strong: #4a5462;
      --bg: #1a1d22;
      --bg-glow: #22262d;
      --surface: #242830;
      --surface-2: #2c313a;
      --accent: #8fb4d6;
      --accent-deep: #a8c7e0;
      --accent-soft: #2a3542;
      --ok: #8fbc8f;
      --warn: #d4b06a;
      --danger: #e09088;
      --sidebar-bg: #16191e;
      --sidebar-bg-2: #14171c;
      --sidebar-text: #e6e8ec;
      --sidebar-muted: #9aa3b0;
      --sidebar-hover: rgba(255,255,255,.06);
      --sidebar-active-bg: rgba(143,180,214,.16);
      --sidebar-brand: #f0f2f5;
      --sidebar-border: #2e343e;
      --accent-rgb: 143, 180, 214;
      --overlay-scrim: rgba(0,0,0,.55);
      --toast-fg: #1a1d22;
      --input-bg: #1e2228;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.28);
      --danger-soft: #3a2a2a;
      --danger-line: #7a4a48;
      --ok-soft: #2a332a;
      --ok-line: #5a7a5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      font-size: 14px;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
      color: var(--sidebar-text);
      padding: 20px 0 16px;
      flex-shrink: 0;
      overflow-y: auto;
      max-height: 100vh;
      border-right: 1px solid var(--sidebar-border);
    }
    .sidebar .brand {
      padding: 0 18px 18px;
      border-bottom: 1px solid var(--sidebar-border);
      margin-bottom: 8px;
    }
    .sidebar .brand-mark {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--sidebar-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .sidebar .brand-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--sidebar-brand);
      letter-spacing: -.01em;
      line-height: 1.25;
    }
    .sidebar .brand-tag {
      margin-top: 6px;
      font-size: 12px;
      color: var(--sidebar-muted);
      line-height: 1.4;
    }
    .sidebar .nav-group { padding: 10px 18px 4px; font-size: 11px; color: var(--sidebar-muted); font-weight: 600; letter-spacing: .04em; }
    .sidebar button {
      display: block; width: calc(100% - 16px); margin: 2px 8px; text-align: left;
      padding: 10px 12px; border: none; background: none; cursor: pointer;
      color: var(--sidebar-text); font-size: 14px; font-family: inherit; border-radius: 8px;
      transition: background .15s, color .15s;
    }
    .sidebar button:hover { background: var(--sidebar-hover); color: var(--sidebar-brand); }
    .sidebar button.active {
      background: var(--sidebar-active-bg);
      color: var(--accent-deep);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .nav-status {
      padding: 8px 18px 12px;
      font-size: 11px;
      color: var(--sidebar-muted);
      line-height: 1.5;
      border-bottom: 1px solid var(--sidebar-border);
      margin-bottom: 6px;
    }
    .nav-user {
      padding: 14px 18px 12px;
      color: var(--sidebar-brand);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.3;
      word-break: break-word;
      border-bottom: 1px solid var(--sidebar-border);
      margin-bottom: 6px;
    }
    .nav-user .nav-user-label {
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--sidebar-muted);
    }
    .me-account-name {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -.01em;
    }
    .main {
      flex: 1;
      padding: 28px 32px 40px;
      overflow: auto;
      max-width: 960px;
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.015em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--ink);
      line-height: 1.25;
    }
    .page-lead {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
      max-width: 48em;
      line-height: 1.55;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .hub-grid { display: grid; gap: 12px; max-width: 560px; }
    .hub-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }
    .hub-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(var(--accent-rgb), .14);
    }
    .hub-card strong { display: block; font-size: 16px; font-weight: 650; color: var(--ink); }
    .hub-card .meta { margin-top: 6px; }
    .upload {
      border: 1.5px dashed var(--line-strong);
      padding: 22px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 12px;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface) 70%, transparent);
      transition: border-color .15s, background .15s, color .15s;
    }
    .upload:hover, .upload.drag {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-deep);
    }
    .parse-modal, .confirm-modal, .modal-bg, .overlay, .loading-mask {
      position: fixed; inset: 0; z-index: 350;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .parse-modal { background: var(--overlay-scrim); z-index: 350; }
    .confirm-modal { background: var(--overlay-scrim); z-index: 450; }
    .modal-bg { background: var(--overlay-scrim); z-index: 200; }
    .overlay { background: var(--overlay-scrim); justify-content: flex-end; z-index: 100; padding: 0; }
    .loading-mask {
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      flex-direction: column; gap: 12px; z-index: 400;
    }
    .parse-panel, .confirm-panel, .modal {
      background: var(--surface);
      width: min(720px, 100%);
      max-height: 88vh;
      overflow: auto;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 16px 48px rgba(0,0,0,.14);
      border: 1px solid var(--line);
    }
    .confirm-panel { width: min(420px, 100%); }
    .modal { width: 560px; max-width: 92vw; max-height: 85vh; }
    .overlay-panel {
      width: 380px; height: 100%; background: var(--surface);
      padding: 22px; box-shadow: -8px 0 28px rgba(0,0,0,.08); overflow-y: auto;
    }
    .parse-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .parse-card.selected { border-color: var(--accent); background: var(--accent-soft); }
    .parse-card label.row { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .parse-card input[type=checkbox] { margin-top: 3px; }
    .btn {
      padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 8px;
      background: var(--surface); cursor: pointer; font-size: 13px; margin: 0 8px 8px 0;
      font-family: inherit; color: var(--ink); font-weight: 500;
      transition: background .12s, border-color .12s, color .12s;
    }
    .btn:hover { background: var(--surface-2); border-color: var(--line-strong); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--toast-fg); border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--toast-fg); }
    .btn-active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--accent-deep); }
    .btn-ghost:hover { background: var(--accent-soft); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-danger { background: var(--surface); color: var(--danger); border-color: var(--danger-line, var(--line-strong)); }
    .btn-danger:hover { background: var(--danger-soft, var(--surface-2)); }
    .btn-danger-solid { background: var(--danger); color: var(--toast-fg); border-color: var(--danger); }
    .btn-danger-solid:hover { filter: brightness(0.92); }
    .tag {
      display: inline-block; background: var(--surface-2); padding: 3px 9px; border-radius: 8px;
      font-size: 11px; margin: 0 4px 4px 0; cursor: default; border: 1px solid var(--line); color: var(--ink-soft);
    }
    .tag.clickable { cursor: pointer; background: var(--accent-soft); color: var(--accent-deep); border-color: var(--line); }
    .tag.clickable:hover { background: var(--surface-2); }
    .tag.clickable.tag-on {
      background: var(--accent); color: var(--toast-fg); border-color: var(--accent-deep);
      font-weight: 600; box-shadow: 0 1px 2px rgba(var(--accent-rgb), .2);
    }
    .tag.tag-parent { font-weight: 600; padding: 4px 12px; font-size: 12px; border-radius: 8px; }
    .tag.tag-child { background: var(--surface-2); color: var(--ink-soft); border-color: var(--line); border-radius: 8px; }
    .tag.tag-child.tag-on { background: var(--accent-deep); color: var(--toast-fg); border-color: var(--accent-deep); }
    .tag.clickable.tag-l1 { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--line); border-radius: 8px; }
    .tag.clickable.tag-l1.tag-on, .tag.clickable.tag-l1:active { background: var(--accent); color: var(--toast-fg); }
    .tag-sub-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
    textarea, input[type=text], input[type=password], input[type=month], input[type=search], select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong);
      border-radius: 8px; font-family: inherit; font-size: 14px; background: var(--input-bg); color: var(--ink);
    }
    textarea:focus, input:focus, select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .18);
    }
    textarea { min-height: 80px; resize: vertical; }
    textarea.auto-grow {
      overflow-y: hidden;
      resize: none;
      max-height: 360px;
      field-sizing: content; /* 新浏览器原生随内容增高 */
    }
    textarea.auto-grow.is-capped { overflow-y: auto; }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; color: var(--ink); }
    .form-row label.req-label, label.req-label { color: var(--danger); }
    .form-row label.req-label .req, .req-label .req, .form-row label .req, .req { color: var(--danger); font-weight: 700; }
    .form-row label.req-label .hint { color: var(--muted); font-weight: 400; }
    .form-row .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hidden { display: none !important; }
    .interview { display: flex; gap: 16px; height: calc(100vh - 140px); min-height: 480px; }
    .col-left, .col-right {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; overflow: auto; box-shadow: var(--shadow);
    }
    .col-left { flex: 6; display: flex; flex-direction: column; }
    .col-right { flex: 4; }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .panel-head h3 { font-size: 14px; font-weight: 650; color: var(--ink); }
    .stage-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 14px; padding: 8px 12px; background: var(--surface-2);
      border-radius: 8px; border: 1px solid var(--line);
    }
    .stage-pill {
      font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 8px;
      background: var(--line); color: var(--ink-soft);
    }
    .stage-pill.on { background: var(--accent-soft); color: var(--accent-deep); }
    .question-box {
      background: var(--surface-2);
      border: 1px solid var(--line); padding: 22px 20px; font-size: 18px; font-weight: 650;
      margin-bottom: 14px; min-height: 84px; line-height: 1.55; border-radius: 10px; color: var(--ink);
    }
    .answer-actions { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 0; }
    .next-actions {
      margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line);
    }
    .tree-node {
      display: flex; align-items: flex-start; gap: 6px; padding: 8px 10px; margin: 2px 0;
      border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid transparent; line-height: 1.4;
    }
    .tree-node:hover { background: var(--surface-2); }
    .tree-node.active { background: var(--accent-soft); border-color: var(--line); }
    .tree-node .tree-label { flex: 1; min-width: 0; }
    .tree-node .tree-del {
      flex-shrink: 0; opacity: 0; padding: 0 4px; font-size: 12px; color: var(--danger);
      border: none; background: none; cursor: pointer;
    }
    .tree-node:hover .tree-del, .tree-node.active .tree-del { opacity: 1; }
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--ink);
      color: var(--toast-fg);
      padding: 14px 22px;
      border-radius: 12px;
      z-index: 500;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      text-align: center;
      max-width: min(90vw, 360px);
      box-shadow: 0 12px 36px rgba(0,0,0,.22);
    }
    .badge {
      display: inline-block; padding: 2px 8px; background: var(--surface-2); border-radius: 8px;
      font-size: 11px; font-weight: 600; color: var(--ink-soft); border: 1px solid var(--line);
    }
    .badge.accent { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--line); }
    .feedback {
      border: 1px solid var(--line); background: var(--surface-2); padding: 14px; margin: 12px 0; border-radius: 10px;
    }
    .score-row { display: flex; align-items: center; gap: 10px; margin: 8px 0 10px; flex-wrap: wrap; }
    .score-num { font-size: 22px; font-weight: 700; color: var(--accent-deep); min-width: 52px; }
    .score-bar { flex: 1; min-width: 120px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .score-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
    .score-dims { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .score-dim { font-size: 11px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); padding: 2px 8px; border-radius: 8px; }
    .voice-btn.recording { background: var(--danger-soft, var(--surface-2)); border-color: var(--danger-line, var(--line-strong)); color: var(--danger); font-weight: 600; }
    .notebook-qa {
      padding: 10px 12px; border-left: 3px solid var(--line-strong); margin: 6px 0; font-size: 13px;
      background: var(--surface-2); border-radius: 0 8px 8px 0;
    }
    .list-row {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      margin-bottom: 8px; cursor: pointer; gap: 12px; box-shadow: var(--shadow);
      transition: border-color .15s;
    }
    .list-row:hover { border-color: var(--accent); }
    .row-actions { flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
    .summary-bar {
      background: var(--accent-soft); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 16px;
    }
    .match-ok { color: var(--ok); }
    .match-gap { color: var(--danger); }
    .match-tip { color: var(--accent-deep); }
    .exp-warn {
      margin-top: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--danger);
      background: var(--danger-soft, var(--surface-2));
      border: 1px solid var(--danger-line, var(--line-strong));
      border-radius: 8px;
      line-height: 1.45;
    }
    .tags-edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .tags-edit-row input { flex: 1; min-width: 0; }
    .tags-edit-row .btn { margin: 0; flex-shrink: 0; white-space: nowrap; }
    .quiz-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 24px; max-width: 640px; margin: 0 auto; box-shadow: var(--shadow);
    }
    .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-panel {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px; color: var(--muted); background: var(--surface-2);
      border-radius: 10px; border: 1px dashed var(--line);
    }
    .empty-panel p:first-child { font-size: 15px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
    .flex-between { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .meta { color: var(--muted); font-size: 12px; }
    .divider { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .status-dot.weak { background: var(--warn); }
    .status-dot.ok { background: var(--ok); }
    .qa-weak { border-color: var(--danger-line, var(--danger)) !important; background: var(--danger-soft, var(--surface-2)); }
    .qa-good { border-color: var(--ok-line, var(--ok)); background: var(--ok-soft, var(--surface-2)); }
    .qa-pending { border-left: 3px solid var(--line-strong); }

/* ========== Backend API ========== */
// http(s) 同域部署（含公网域名）直接走相对路径；file:// 本地打开才回落本机
const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';

function getAuthToken() {
  return localStorage.getItem(AUTH_TOKEN_KEY) || '';
}

function setAuthSession(token, user) {
  if (token) localStorage.setItem(AUTH_TOKEN_KEY, token);
  state.authUser = user || null;
}

function clearAuthSession() {
  localStorage.removeItem(AUTH_TOKEN_KEY);
  state.authUser = null;
  state.adminUsers = null;
  state.adminDetail = null;
  state.adminSummary = null;
  state.experiences = [];
  state.knowledge = [];
  state.debriefs = [];
  state.session = null;
}

function authHeaders(extra) {
  const h = Object.assign({}, extra || {});
  const token = getAuthToken();
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}

function _errDetail(text, status, statusText) {
  let msg = status + ' ' + statusText;
  try {
    const j = JSON.parse(text);
    if (j && j.detail) {
      msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail);
    } else if (text) msg = text;
  } catch (e) {
    if (text) msg = text;
  }
  return msg;
}

async function api(path, opts) {
  opts = opts || {};
  const headers = authHeaders(Object.assign(
    { 'Content-Type': 'application/json' },
    opts.headers || {}
  ));
  if (opts.body instanceof FormData) delete headers['Content-Type'];
  const fetchOpts = Object.assign({}, opts, { headers: headers });
  const res = await fetch(API_BASE + path, fetchOpts);
  if (res.status === 401 && path.indexOf('/api/auth/') !== 0 && path !== '/api/health') {
    clearAuthSession();
    render();
    throw new Error('请先登录');
  }
  if (!res.ok) {
    let body = '';
    try { body = await res.text(); } catch (e) {}
    throw new Error(_errDetail(body, res.status, res.statusText));
  }
  if (res.status === 204) return null;
  const ct = res.headers.get('content-type') || '';
  if (ct.indexOf('application/json') >= 0) return res.json();
  return res.text();
}

function mapKnowledge(k) {

function replaceExp(mapped) {

async function refreshAll() {
  const [exps, know, debriefs, health] = await Promise.all([
    api('/api/experiences'),
    api('/api/knowledge'),
    api('/api/debriefs'),
    api('/api/health'),
  ]);
  state.experiences = exps.map(mapExp);
  state.knowledge = know.map(mapKnowledge);
  state.debriefs = debriefs;
  state.apiOnline = true;
  state.apiError = '';
  state.llmEffective = health.llm_effective || 'mock';
  state.ttsEffective = health.tts_effective || 'browser';
  state.ttsDoubaoConfigured = !!health.tts_doubao_configured;
  try {
    const voiceStatus = await api('/api/voice/status');
    state.ttsDoubaoConfigured = !!voiceStatus.doubao_configured;
    state.ttsEffective = voiceStatus.effective || state.ttsEffective;
    state.ttsVoices = voiceStatus.voices || [];
    state.ttsDefaultSpeaker = voiceStatus.speaker || '';
    if (!state.voiceSpeaker && state.ttsDefaultSpeaker) {
      state.voiceSpeaker = state.ttsDefaultSpeaker;
    }
    if (state.voiceSpeaker && state.ttsVoices.length) {
      const ok = state.ttsVoices.some(function (v) { return v.id === state.voiceSpeaker; });
      if (!ok) state.voiceSpeaker = state.ttsDefaultSpeaker || state.ttsVoices[0].id;
    }
  } catch (e) {
    state.ttsVoices = [];
  }
  if (state.ttsDoubaoConfigured && !localStorage.getItem('cv_tts_mode')) {
    state.voiceTtsMode = 'doubao';
    localStorage.setItem('cv_tts_mode', 'doubao');
  }
  if (state.voiceSpeaker) {
    localStorage.setItem('cv_tts_speaker', state.voiceSpeaker);
  }
  if (!state.interview.expId && state.experiences.length) {
    state.interview.expId = state.experiences[0].id;
  }
  if (!state.voice.expId && state.experiences.length) {
    state.voice.expId = state.interview.expId || state.experiences[0].id;
  }
  if (state.sessionSetup.expIds == null && state.experiences.length) {
    state.sessionSetup.expIds = state.experiences.map(function (e) { return e.id; });
  } else if (state.sessionSetup.expIds == null) {
    state.sessionSetup.expIds = [];

  if (!state.sessionSetup.targetRole) {
    const p = state.profile || loadProfile();
    state.sessionSetup.targetRole = p.targetRole || '';
  }
}

/* ========== utils ========== */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2200);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function findNode(tree, id) {
  for (const n of tree) {
    if (n.nodeId === id) return n;
    const f = findNode(n.children || [], id);
    if (f) return f;
  }
  return null;
}

function updateNode(tree, id, patch) {
  return tree.map(n => n.nodeId === id ? { ...n, ...patch } :
    { ...n, children: updateNode(n.children || [], id, patch) });
}

function addChild(tree, parentId, child) {
  return tree.map(n => n.nodeId === parentId ? { ...n, children: [...(n.children || []), child] } :
    { ...n, children: addChild(n.children || [], parentId, child) });
}

function genId(parentId, siblings) {
  if (!parentId) return 'q' + (siblings.length + 1);
  const nums = siblings.map(s => parseInt(s.nodeId.split('.').pop(), 10)).filter(Boolean);
  return parentId + '.' + ((nums.length ? Math.max(...nums) : 0) + 1);
}

function collectNodes(tree) {
  const out = [];
  const walk = (nodes) => (nodes || []).forEach(n => { out.push(n); walk(n.children); });
  walk(tree);
  return out;
}

function countNodes(tree) { return collectNodes(tree).length; }

function summarizeKnowledgeTags(tree) {
  const map = {};
  collectNodes(tree).forEach(n => {
    const tags = n.knowledgeTags || n.labels || [];
    if (!tags.length) return;
    const key = tags.join(' · ');
    map[key] = (map[key] || 0) + 1;
  });
  return Object.entries(map).map(([label, count]) => ({ label, count, parts: label.split(' · ') }));
}

function getExpById(id) { return state.experiences.find(e => e.id === id); }
function getExp() { return getExpById(state.interview.expId); }

function findTagParent(childKey) {
  const hit = EXP_TAG_CHILD_INDEX[childKey];
  return hit ? hit.parent : '';
}

function getTagParentNode(parentKey) {
  return EXP_TAG_TREE.find(function (p) { return p.key === parentKey; }) || null;
}

/** 原始标签 → { parents, children }；优先匹配细分，再回填大类 */
function classifyExpTagTree(tags) {
  const parents = [];
  const children = [];
  const seenP = {};
  const seenC = {};
  (tags || []).forEach(function (raw) {
    const t = String(raw || '').trim();
    if (!t) return;
    if (EXP_TAG_PARENT_KEYS.indexOf(t) >= 0) {
      if (!seenP[t]) { seenP[t] = true; parents.push(t); }
      return;
    }
    if (EXP_TAG_CHILD_INDEX[t]) {
      if (!seenC[t]) {
        seenC[t] = true;
        children.push(t);
        const p = EXP_TAG_CHILD_INDEX[t].parent;
        if (!seenP[p]) { seenP[p] = true; parents.push(p); }
      }
      return;
    }
    let matched = false;
    for (let i = 0; i < EXP_TAG_TREE.length; i++) {
      const parent = EXP_TAG_TREE[i];
      for (let j = 0; j < (parent.children || []).length; j++) {
        const child = parent.children[j];
        if (child.re.test(t)) {
          if (!seenC[child.key]) {
            seenC[child.key] = true;
            children.push(child.key);
          }
          if (!seenP[parent.key]) {
            seenP[parent.key] = true;
            parents.push(parent.key);
          }
          matched = true;
          break;
        }
      }
      if (matched) break;
    }
    if (!matched && /待确认|待补充|待整理/.test(t)) {
      if (!seenC['待整理']) { seenC['待整理'] = true; children.push('待整理'); }
    }
  });
  if (!parents.length && !children.length) {
    return { parents: [], children: ['待整理'] };
  }
  return { parents: parents, children: children };
}

/** 卡片展示用：AI · RAG调优 */
function classifyExpTags(tags) {
  const tree = classifyExpTagTree(tags);
  const labels = [];
  const used = {};
  tree.children.forEach(function (c) {
    const p = findTagParent(c);
    const label = p ? (p + ' · ' + c) : c;
    if (!used[label]) { used[label] = true; labels.push(label); }
  });
  tree.parents.forEach(function (p) {
    const hasChild = tree.children.some(function (c) { return findTagParent(c) === p; });
    if (!hasChild && !used[p]) { used[p] = true; labels.push(p); }
  });
  return labels.length ? labels : ['待整理'];
}

function expMatchesTagFilter(exp) {
  const parent = state.expTagParent || '';
  const child = state.expTagFilter || '';
  if (!parent && !child) return true;
  const tree = classifyExpTagTree(exp.tags);
  if (child) return tree.children.indexOf(child) >= 0;
  return tree.parents.indexOf(parent) >= 0;
}

function setExpTagParent(key) {
  key = key || '';
  if (!key) {
    state.expTagParent = '';
    state.expTagFilter = '';
  } else if (state.expTagParent === key && !state.expTagFilter) {
    // 已展开且未选细分时再点 → 收起
    state.expTagParent = '';
    state.expTagFilter = '';
  } else {
    state.expTagParent = key;
    if (state.expTagFilter && findTagParent(state.expTagFilter) !== key) {
      state.expTagFilter = '';
    }
  }
  render();
}

function setExpTagChild(key) {
  key = key || '';
  if (!key) {
    state.expTagFilter = '';
  } else if (state.expTagFilter === key) {
    state.expTagFilter = '';
  } else {
    state.expTagFilter = key;
    const p = findTagParent(key);
    if (p) state.expTagParent = p;
    else if (key === '待整理') state.expTagParent = '';
  }
  render();
}

/** 从卡片标签点选：支持「AI」「RAG调优」「AI · RAG调优」 */
function pickExpTagFromCard(label) {
  const raw = String(label || '').trim();
  if (!raw) return;
  if (raw.indexOf(' · ') >= 0) {
    const parts = raw.split(' · ');
    const parent = parts[0];
    const child = parts.slice(1).join(' · ');
    state.expTagParent = parent;
    state.expTagFilter = child;
    render();
    return;
  }
  if (EXP_TAG_PARENT_KEYS.indexOf(raw) >= 0) {
    setExpTagParent(raw);
    return;
  }
  if (EXP_TAG_CHILD_INDEX[raw] || raw === '待整理') {
    setExpTagChild(raw);
    return;
  }
  // 尝试按文案匹配大类 / 细分
  const parentHit = EXP_TAG_TREE.find(function (p) { return p.key === raw || p.label === raw; });
  if (parentHit) { setExpTagParent(parentHit.key); return; }
  toast('未识别的标签：' + raw);
}

function getVisibleParentTags() {
  const counts = {};
  state.experiences.forEach(function (e) {
    classifyExpTagTree(e.tags).parents.forEach(function (p) {
      counts[p] = (counts[p] || 0) + 1;
    });
  });
  // 始终展示全部大类，方便点开看细分
  return EXP_TAG_TREE.map(function (p) {
    return { key: p.key, label: p.label, count: counts[p.key] || 0, children: p.children };
  });
}

function getVisibleChildTags(parentKey) {
  const node = getTagParentNode(parentKey);
  if (!node) return [];
  const counts = {};
  state.experiences.forEach(function (e) {
    classifyExpTagTree(e.tags).children.forEach(function (c) {
      if (findTagParent(c) === parentKey) counts[c] = (counts[c] || 0) + 1;
    });
  });
  // 选中大类后始终列出该大类下全部细分
  return (node.children || []).map(function (c) {
    return { key: c.key, count: counts[c.key] || 0 };
  });
}

function filterExperiences(list) {
  const q = (state.expSearch || '').trim().toLowerCase();
  const typeF = state.expTypeFilter || '全部';
  return (list || []).filter(function (e) {
    if (typeF !== '全部' && (e.type || '经历') !== typeF) return false;
    if (!expMatchesTagFilter(e)) return false;
    if (!q) return true;
    const tree = classifyExpTagTree(e.tags);
    const hay = [
      e.title, e.company, e.role, e.period, e.summary, e.metrics, e.extra, e.type,
      ...(e.tags || []),
      ...tree.parents,
      ...tree.children,
      ...classifyExpTags(e.tags),
    ].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  });
}

  if (/后端|接口|数据库|MySQL|Redis/i.test(q)) return ['技术', '后端', '知识库'];
  if (/协作|跨部门|冲突|沟通/i.test(q)) return ['协作沟通', '跨部门'];
  if (/指标|漏斗|增长|数据/i.test(q)) return ['业务理解', '指标设计'];
  if (/介绍|负责|STAR/i.test(q)) return ['行为面试', '项目介绍'];
  return ['行为面试'];
}

/** 文本框随内容增高，到上限后内部滚动 */
function bindAutoGrowTextareas(root) {
  root = root || document;
  const list = root.querySelectorAll ? root.querySelectorAll('textarea') : [];
  list.forEach(function (el) {
    if (el.dataset.autogrow === '0') return;
    el.classList.add('auto-grow');
    const maxH = parseInt(el.getAttribute('data-max-h') || el.dataset.maxH || '360', 10);
    const grow = function () {
      el.style.height = 'auto';
      const next = Math.min(el.scrollHeight, maxH);
      el.style.height = next + 'px';
      if (el.scrollHeight > maxH) el.classList.add('is-capped');
      else el.classList.remove('is-capped');
    };
    if (!el._autogrowBound) {
      el.addEventListener('input', grow);
      el.addEventListener('paste', function () { setTimeout(grow, 0); });
      el._autogrowBound = true;
    }
    grow();
  });
}

/* ========== 删除确认（按模块隔离；「今日内跳过」存 localStorage，跨日失效） ========== */

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function loadSkipMap() {
  try {
    const raw = localStorage.getItem(SKIP_DELETE_KEY);
    if (!raw) return {};
    const obj = JSON.parse(raw);
    // 旧格式 { date: "YYYY-MM-DD" } → 丢弃，避免全局误伤其它模块
    if (obj && typeof obj.date === 'string' && !Object.keys(DELETE_SCOPES).some(function (k) { return k in obj; })) {
      localStorage.removeItem(SKIP_DELETE_KEY);
      return {};
    }
    return obj && typeof obj === 'object' ? obj : {};
  } catch (e) {
    return {};
  }
}

function shouldSkipDeleteConfirm(scope) {
  if (!scope) return false;
  const map = loadSkipMap();
  return map[scope] === todayStr();
}

function setSkipDeleteConfirmToday(scope) {
  if (!scope) return;
  const map = loadSkipMap();
  map[scope] = todayStr();
  localStorage.setItem(SKIP_DELETE_KEY, JSON.stringify(map));
}

function clearSkipDeleteConfirm(scope) {
  const map = loadSkipMap();
  if (scope) delete map[scope];
  else Object.keys(map).forEach(function (k) { delete map[k]; });
  localStorage.setItem(SKIP_DELETE_KEY, JSON.stringify(map));
}

function loadProfile() {

    return {
      displayName: name,
      targetRole: (obj && obj.targetRole) || '',
      note: (obj && obj.note) || '',
    };
  } catch (e) {
    return { displayName: '', targetRole: '', note: '' };
  }
}

 * 删除前确认。opts.scope 必填，用于模块隔离跳过。

function confirmDelete(opts) {
  opts = opts || {};
  const scope = opts.scope || 'experience';
  if (shouldSkipDeleteConfirm(scope)) return Promise.resolve(true);
  const scopeLabel = DELETE_SCOPES[scope] || scope;
  return new Promise(function (resolve) {
    state.confirmDialog = {
      scope: scope,
      title: opts.title || '确认删除？',
      body: opts.body || '删除后无法恢复。',
      dangerLabel: opts.dangerLabel || '确认删除',
      scopeLabel: scopeLabel,
      skipChecked: false,
      resolve: resolve,
    };
    render();
  });
}

function renderConfirmDialog() {
  const d = state.confirmDialog;
  if (!d) return '';
  return `<div class="confirm-modal" onclick="if(event.target===this)cancelConfirmDialog()">
    <div class="confirm-panel">

  const d = state.confirmDialog;

function acceptConfirmDialog() {
  const d = state.confirmDialog;
  if (!d) return;
  const skipEl = document.getElementById('confirm-skip-today');
  if ((skipEl && skipEl.checked) || d.skipChecked) setSkipDeleteConfirmToday(d.scope);

function onResumeDrop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag');
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (f) parseResumeFile(f);
}

function onResumeFileSelected(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (f) parseResumeFile(f);
}

async function parseResumeFile(file) {
  const paste = (document.getElementById('resume-paste') || {}).value || '';
  const fd = new FormData();
  fd.append('file', file);
  if (paste.trim()) fd.append('text', paste.trim());
  await runResumeParse(fd);
}

async function parseResumeText() {
  const paste = (document.getElementById('resume-paste') || {}).value || '';
  if (!paste.trim()) { toast('请先粘贴简历文本'); return; }
  const fd = new FormData();
  fd.append('text', paste.trim());
  await runResumeParse(fd);
}

async function runResumeParse(formData) {
  if (!state.apiOnline) { toast('暂时连不上服务'); return; }
  showLoading('正在解析简历…');
  try {
    const res = await fetch(API_BASE + '/api/experiences/parse', {
      method: 'POST',
      headers: authHeaders(),
      body: formData,
    });
    if (res.status === 401) {
      clearAuthSession();
      render();
      throw new Error('请先登录');
    }
    if (!res.ok) {
      let msg = res.status + ' ' + res.statusText;
      try { msg = await res.text(); } catch (e) {}
      throw new Error(msg);
    }
    const data = await res.json();
    hideLoading();
    state.resumeParse = {
      items: (data.items || []).map(function (it, i) {
        return Object.assign({}, it, { _selected: true, _idx: i });
      }),
      warning: data.warning || '',
      llm_effective: data.llm_effective || 'mock',
      char_count: data.char_count || 0,
      text_preview: data.text_preview || '',
    };
    toast('解析出 ' + state.resumeParse.items.length + ' 条经历');
    render();
  } catch (e) {
    hideLoading();
    toast('解析失败：' + e.message);
    render();
  }
}

async function importParsedExperiences() {

  if (!p) return;
  const items = p.items.filter(function (x) { return x._selected; }).map(function (x) {
    return {
      type: x.type || '实习',
      company: x.company || '',
      role: x.role || '',
      period: x.period || '',
      summary: x.summary || '',
      metrics: x.metrics || '',
      extra: x.extra || '',
      tags: x.tags || [],
      title: x.title || null,
    };
  });
  if (!items.length) { toast('请至少勾选一条'); return; }
  showLoading('正在导入…');
  try {
    const data = await api('/api/experiences/import', {
      method: 'POST',
      body: JSON.stringify({ items: items }),

    state.resumeParse = null;

function aiSuggestExpTags() {
  const company = (document.getElementById('f-company') || {}).value || '';
  const role = (document.getElementById('f-role') || {}).value || '';
  const period = (document.getElementById('f-period') || {}).value || '';
  const summary = (document.getElementById('f-summary') || {}).value || '';
  const metrics = (document.getElementById('f-metrics') || {}).value || '';
  const extra = (document.getElementById('f-extra') || {}).value || '';
  const type = (document.getElementById('f-type') || {}).value || '实习';
  if (!(summary.trim() || company.trim())) {
    toast('请先填写公司/项目或主要工作内容');
    return;
  }
  (async function () {
    try {
      showLoading('AI 正在生成标签…');
      const data = await api('/api/experiences/suggest-tags', {
        method: 'POST',
        body: JSON.stringify({ type, company, role, period, summary, metrics, extra }),
      });
      hideLoading();
      const tags = data.tags || [];

      if (el) el.value = tags.join(', ');
      toast(tags.length ? (data.llm_effective === 'openai' ? '已生成标签' : '已生成标签（演示规则）') : '未生成标签');
    } catch (e) {
      hideLoading();
      toast('生成失败：' + e.message);

async function saveExpForm() {
  const type = document.getElementById('f-type').value;
  const company = document.getElementById('f-company').value.trim();
  const role = document.getElementById('f-role').value.trim();
  const period = document.getElementById('f-period').value.trim();
  const summary = document.getElementById('f-summary').value.trim();
  const metrics = document.getElementById('f-metrics').value.trim();
  const extra = document.getElementById('f-extra').value.trim();
  const tags = document.getElementById('f-tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);

  if (!company || !role || !period || !summary) {
    toast('请填写带 * 的必填项');
    return;
  }

  const payload = { type, company, role, period, summary, metrics, extra, tags, title: `${company} · ${role}` };
  try {
    if (state.expForm.isNew) {
      const created = await api('/api/experiences', { method: 'POST', body: JSON.stringify(payload) });
      replaceExp(mapExp(created));
      toast('经历已添加');
    } else {
      const updated = await api('/api/experiences/' + state.expForm.id, {
        method: 'PUT', body: JSON.stringify(payload),
      });
      replaceExp(mapExp(updated));
      toast('经历已更新');
    }
    state.expForm = null;
    render();
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

async function deleteExperience(expId, scope) {
  const exp = getExpById(expId);
  if (!exp) { toast('经历不存在'); return; }
  const ok = await confirmDelete({
    scope: scope || 'experience',
    title: '删除这段经历？',
    body: '将删除「' + (exp.title || exp.company) + '」及其全部追问树记录，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/experiences/' + expId, { method: 'DELETE' });
    state.experiences = state.experiences.filter(function (e) { return e.id !== expId; });
    if (state.interview.expId === expId) {
      state.interview.expId = state.experiences[0] ? state.experiences[0].id : '';
      state.interview.phase = 'idle';
      state.interview.activeNodeId = null;
    }
    if (state.expForm && state.expForm.id === expId) state.expForm = null;
    if (state.notebookDetailExpId === expId) {
      state.notebookDetailExpId = null;
      state.page = (scope === 'notebook') ? 'notebook' : 'experience';
    }
    toast('经历已删除');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

      <textarea oninput="state.introContent=this.value;updateIntroDirty()" placeholder="在这里写你的自我介绍定稿…">${esc(state.introContent)}</textarea>
      <button id="intro-save-btn" class="btn ${state.introDirty ? 'btn-primary' : ''}" style="margin-top:8px"
        ${state.introDirty ? '' : 'disabled'} onclick="saveIntroDraft()">保存定稿</button>
      <button class="btn btn-danger" style="margin-top:8px" onclick="clearIntro()">清空自我介绍</button>
    </div>`;
}

function startIntroAI(mode) {
  if (mode === 'polish' && !(state.introContent || '').trim()) {
    toast('请先在编辑区写一些内容，或改用「AI 生成初稿」');
    return;
  }
  state.introWizard = { mode, step: 0, input: '', guideAnswers: [], hint: INTRO_GUIDE_QUESTIONS[0] };
  if (mode === 'generate') runIntroAI();
  else render();
}

async function runIntroAI() {
  const w = state.introWizard;
  if (!w) return;
  const payload = {
    mode: w.mode,
    content: state.introContent || '',
    target_role: (state.profile && state.profile.targetRole) || state.sessionSetup.targetRole || '',
    guide_answers: w.guideAnswers || [],
    experiences: expBriefsForIntro(),
  };
  try {
    showLoading(w.mode === 'generate' ? 'AI 正在写初稿…' : (w.mode === 'polish' ? 'AI 正在润色…' : 'AI 正在组织成稿…'));
    const data = await api('/api/intro', { method: 'POST', body: JSON.stringify(payload) });
    hideLoading();
    if (w.mode === 'guide' && data.hint && !(data.content || '').trim()) {
      w.hint = data.hint;
      render();
      return;
    }
    if ((data.content || '').trim()) {
      state.introContent = data.content;
      state.introDirty = (state.introContent || '') !== (state.introSaved || '');
      state.introWizard = null;
      toast('已填入编辑区，记得点「保存定稿」');
      render();
      return;
    }
    toast('未生成内容，请重试');
    render();
  } catch (e) {
    hideLoading();
    toast('AI 失败：' + e.message);
    render();
  }
}

function renderIntroWizardModal() {
  const w = state.introWizard;
  if (!w || w.mode === 'generate') return '';
  const title = w.mode === 'polish' ? 'AI 润色' : 'AI 引导提问';
  return `<div class="modal-bg" onclick="state.introWizard=null;render()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 style="margin-bottom:12px">${title}</h3>
      ${w.mode === 'polish' ? `<p class="meta" style="margin-bottom:12px">将保留你的事实，优化口述节奏与亮点排序。</p>` : `
        <p class="meta" style="margin-bottom:8px">第 ${w.guideAnswers.length + 1} / ${INTRO_GUIDE_QUESTIONS.length} 题</p>
        <p style="margin-bottom:12px;line-height:1.5">${esc(w.hint || INTRO_GUIDE_QUESTIONS[w.guideAnswers.length])}</p>
        <textarea placeholder="输入你的回答…" oninput="state.introWizard.input=this.value">${esc(w.input)}</textarea>
      `}
      <div style="margin-top:12px">
        ${w.mode === 'polish' ? `<button class="btn btn-primary" onclick="runIntroAI()">开始润色</button>` : `
          <button class="btn btn-primary" onclick="submitIntroGuideAnswer()">${w.guideAnswers.length + 1 >= INTRO_GUIDE_QUESTIONS.length ? '生成自我介绍' : '下一题'}</button>
        `}
        <button class="btn" onclick="state.introWizard=null;render()">取消</button>
      </div>
    </div>
  </div>`;
}

function submitIntroGuideAnswer() {
  const w = state.introWizard;
  if (!w) return;
  const ans = (w.input || '').trim();
  if (!ans) { toast('请先回答本题'); return; }
  w.guideAnswers.push(ans);
  w.input = '';
  if (w.guideAnswers.length >= INTRO_GUIDE_QUESTIONS.length) {
    runIntroAI();
  } else {
    w.hint = INTRO_GUIDE_QUESTIONS[w.guideAnswers.length];
    render();
  }
}

}

async function startSession(channel) {
  if (channel !== 'voice') return;
  const s = state.sessionSetup;
  s.targetRole = (document.getElementById('sess-role') && document.getElementById('sess-role').value) || s.targetRole || '';
  s.jdText = (document.getElementById('sess-jd') && document.getElementById('sess-jd').value) || s.jdText || '';
  if (!(s.expIds || []).length) { toast('请至少勾选一段经历'); return; }
  if (!(s.targetRole || '').trim()) { toast('请填写目标岗位'); return; }
  try {
    showLoading('面试官正在根据你的投递材料出题…');

      method: 'POST',

        exp_ids: s.expIds,
        target_role: s.targetRole,
        jd_text: s.jdText,
        channel: 'voice',
      }),
    });
    state.session = data;

    v.phase = data.phase || 'question';
    v.activeNodeId = data.active_node_id;
    v.currentQ = data.question || '';
    v.draft = '';

    render();

    toast('已覆盖 ' + (data.covered_exp_ids || []).length + ' 段 · 共 ' + (data.exp_ids || []).length + ' 段');

    hideLoading();
    toast('开始失败：' + e.message);
    render();

/* ========== ③ 文字准备（追问树） ========== */
function renderScoreBlock(node) {
  if (!node) return '';
  const dims = node.scoreDims || node.score_dims || {};
  const score = node.score != null ? Number(node.score) : null;
  const hints = node.scoreHints || node.score_hints || [];
  if (score == null && !Object.keys(dims).length) return '';
  return `
    <div class="score-row">
      ${score != null ? `<span class="score-num">${score}</span><span class="meta">/100</span>
      <div class="score-bar"><i style="width:${Math.max(0, Math.min(100, score))}%"></i></div>` : ''}
    </div>
    <div class="score-dims">
      ${Object.keys(SCORE_DIM_LABELS).map(function (k) {
        const v = dims[k];
        if (v == null) return '';
        return `<span class="score-dim">${SCORE_DIM_LABELS[k]} ${v}/10</span>`;
      }).join('')}
    </div>
    ${hints.length ? `<p class="meta" style="margin-top:6px">${hints.map(esc).join(' · ')}</p>` : ''}
  `;
}

function debriefItemScore(it) {
  if (it == null || it.score == null) return null;
  const n = Number(it.score);
  return isNaN(n) ? null : n;
}

function debriefScoreSummary(items) {
  const scored = (items || []).map(debriefItemScore).filter(function (s) { return s != null; });
  if (!scored.length) return null;
  const avg = Math.round(scored.reduce(function (a, b) { return a + b; }, 0) / scored.length);
  return { avg, count: scored.length, total: (items || []).length };
}

function renderDebriefScoreBadge(it) {
  const s = debriefItemScore(it);
  if (s == null) return '';
  return `<span class="badge" style="margin-left:6px">${s}/100</span>`;
}

function renderTree(tree, activeId, depth, treeOpts) {
  depth = depth || 0;
  treeOpts = treeOpts || { mode: 'exp', expId: '' };
  const mode = treeOpts.mode || 'exp';
  const expId = treeOpts.expId || '';
  return (tree || []).map(function (n) {
    const delClick = mode === 'session'
      ? `event.stopPropagation();toast('会话树请用归档，勿直接删除')`
      : `event.stopPropagation();deleteTreeNode('${expId}','${n.nodeId}')`;
    const archived = n.archivedToExpId && n.archivedToNodeId;
    const archiveBtn = mode === 'session'
      ? (archived
        ? `<button type="button" class="tree-del" title="已归档到笔记本" onclick="event.stopPropagation();toast('已归档到笔记本')">✓</button>`
        : `<button type="button" class="tree-del" title="归档到笔记本" onclick="event.stopPropagation();archiveSessionNode('${n.nodeId}')">归档</button>`)
      : '';
    const actionBtn = mode === 'session' ? archiveBtn : `<button type="button" class="tree-del" title="删除本题" onclick="${delClick}">×</button>`;
    return `
    <div style="margin-left:${depth * 14}px">
      <div class="tree-node ${activeId===n.nodeId?'active':''}" onclick="selectNode('${n.nodeId}')">
        <div class="tree-label">
          <small style="color:var(--muted)">${esc(n.nodeId)}</small> ${esc(n.question.slice(0, 36))}${n.question.length>36?'…':''}
          ${n.answer ? '<span class="badge">已答</span>' : ''}
          ${archived ? '<span class="badge">已归档</span>' : ''}
        </div>
        ${actionBtn}
      </div>
      ${renderTree(n.children, activeId, depth + 1, treeOpts)}
    </div>`;
  }).join('');
}

async function archiveSessionNode(nodeId) {
  if (!state.session) { toast('没有进行中的语音会话'); return; }
  const node = findNode(state.session.qa_tree || [], nodeId);
  if (!node) { toast('节点不存在'); return; }
  if (node.archivedToExpId && node.archivedToNodeId) {
    toast('该题已归档过');
    return;
  }
  try {
    showLoading('归档到笔记本…');
    const data = await api('/api/sessions/' + state.session.id + '/archive-node', {
      method: 'POST',
      body: JSON.stringify({ node_id: nodeId }),
    });
    state.session = data.session;
    replaceExp(mapExp(data.experience));
    hideLoading();
    toast(data.message || '已归档到笔记本');
    render();
  } catch (e) {
    hideLoading();
    toast('归档失败：' + e.message);
    render();
  }
}

async function deleteTreeNode(expId, nodeId) {
  const exp = getExpById(expId);
  const node = exp ? findNode(exp.qaTree, nodeId) : null;
  if (!node) { toast('节点不存在'); return; }
  const childCount = countSubtreeNodes(node) - 1;
  const ok = await confirmDelete({
    scope: 'tree',
    title: '删除这道题？',
    body: '将删除「' + nodeId + '」' + (childCount > 0 ? '及其 ' + childCount + ' 个子追问' : '') + '，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/interview/' + expId + '/nodes/' + encodeURIComponent(nodeId), { method: 'DELETE' });
    const full = await api('/api/experiences/' + expId);
    const mapped = mapExp(full);
    replaceExp(mapped);
    const iv = state.interview;
    if (iv.expId === expId && !findNode(mapped.qaTree, iv.activeNodeId)) {
      iv.activeNodeId = null;
      iv.phase = 'idle';
      iv.currentQ = '';
      iv.draft = '';
      iv.mode = null;
      iv.branchFrom = null;
    }
    toast('已删除 ' + nodeId);
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

function countSubtreeNodes(node) {
  let n = 1;
  (node.children || []).forEach(function (c) { n += countSubtreeNodes(c); });
  return n;
}

async function startInterview() {
  const iv = state.interview;
  try {
    toast('请求中…');
    const data = await api('/api/interview/' + iv.expId + '/start', { method: 'POST', body: '{}' });
    const full = await api('/api/experiences/' + iv.expId);
    replaceExp(mapExp(full));
    iv.activeNodeId = data.active_node_id;
    iv.currentQ = data.question;
    iv.phase = data.phase;
    iv.draft = (data.node && data.node.answer) || '';
    iv.branchFrom = null;
    iv.mode = null;
    render();
  } catch (e) {
    toast('开始失败：' + e.message);
  }
}

function selectNode(id) {
  if (state.page === 'voice' && state.session) {
    const n = findNode(state.session.qa_tree || [], id);
    if (!n) return;
    stopVoiceListen();
    const v = state.voice;
    v.activeNodeId = id;
    v.currentQ = n.question;
    v.draft = n.answer || '';
    v.phase = n.answer ? 'feedback' : 'question';
    render();
    return;
  }
  const exp = getExp();
  if (!exp) return;
  const n = findNode(exp.qaTree, id);
  if (!n) return;
  const iv = state.interview;
  iv.activeNodeId = id;
  iv.currentQ = n.question;
  iv.draft = n.answer || '';
  iv.branchFrom = id;
  iv.mode = n.answerMode || null;
  iv.phase = n.answer ? 'feedback' : 'question';
  render();
}

async function pickMode(mode) {
  const iv = state.interview;
  if (iv.phase === 'feedback') return;
  if (!iv.activeNodeId || !iv.expId) { toast('请先开始提问'); return; }
  const prev = iv.mode;
  iv.mode = mode;
  iv.phase = 'answering';
  if (mode === 'user_answered') {
    // 首次点选清空；从 AI/框架切回时保留草稿，方便改成自己的话
    if (!prev) iv.draft = '';
    render();
    return;
  }
  try {
    showLoading(mode === 'ai_generated' ? 'AI 正在按本题生成参考答案…' : 'AI 正在生成答题框架…');
    const data = await api('/api/interview/' + iv.expId + '/draft', {
      method: 'POST',
      body: JSON.stringify({ node_id: iv.activeNodeId, mode }),
    });
    iv.draft = data.draft || '';
    hideLoading();
    render();
  } catch (e) {
    hideLoading();
    toast('生成失败：' + e.message);
    render();
  }
}

async function submitAnswer() {
  const iv = state.interview;
  if (!iv.expId || !iv.activeNodeId) { toast('请先开始提问'); return; }
  try {
    showLoading('正在点评…');
    await api('/api/interview/' + iv.expId + '/answer', {
      method: 'POST',
      body: JSON.stringify({
        node_id: iv.activeNodeId,
        answer: iv.draft,
        answer_mode: iv.mode || 'user_answered',
      }),
    });
    const full = await api('/api/experiences/' + iv.expId);
    replaceExp(mapExp(full));
    iv.phase = 'feedback';
    iv.branchFrom = iv.activeNodeId;
    hideLoading();
    render();
    toast('已点评并保存');
  } catch (e) {
    hideLoading();
    toast('提交失败：' + e.message);
  }
}

async function nextStep(action) {
  const iv = state.interview;
  if (action === 'end') {
    iv.phase = 'idle';
    iv.activeNodeId = null;
    iv.currentQ = '';
    iv.draft = '';
    iv.mode = null;
    render();
    return;
  }
  if (action === 'switch_exp') {
    const others = state.experiences.filter(function (e) { return e.id !== iv.expId; });
    if (others.length) {
      iv.expId = others[0].id;
      iv.phase = 'idle';
      iv.activeNodeId = null;
      iv.currentQ = '';
      iv.draft = '';
      iv.mode = null;
    } else {
      toast('没有其他经历可切换');
    }
    render();
    return;
  }
  const fromNodeId = iv.activeNodeId || iv.branchFrom;
  if (!fromNodeId) { toast('请先选中一个节点'); return; }
  try {
    showLoading('生成下一问…');
    const data = await api('/api/interview/' + iv.expId + '/next', {
      method: 'POST',
      body: JSON.stringify({ from_node_id: fromNodeId, action }),
    });
    const full = await api('/api/experiences/' + iv.expId);
    replaceExp(mapExp(full));
    iv.activeNodeId = data.active_node_id;
    iv.currentQ = data.question;
    iv.draft = '';
    iv.mode = null;
    iv.phase = data.phase || 'question';
    iv.branchFrom = data.active_node_id;
    hideLoading();
    render();
    toast('已追问 → ' + data.active_node_id);
  } catch (e) {
    hideLoading();
    toast('下一步失败：' + e.message);
  }
}

async function toggleMark(m) {
  const exp = getExp();
  const n = findNode(exp.qaTree, state.interview.activeNodeId);
  if (!n) return;
  const marks = n.marks.includes(m) ? n.marks.filter(x => x !== m) : [...n.marks, m];
  try {
    await api('/api/interview/' + exp.id + '/nodes/' + n.nodeId + '/marks', {
      method: 'PATCH',
      body: JSON.stringify({ marks }),
    });
    const full = await api('/api/experiences/' + exp.id);
    replaceExp(mapExp(full));
    render();
  } catch (e) {
    toast('标记失败：' + e.message);
  }
}

let _voiceRecognition = null;
let _voiceAudio = null;

function shouldUseDoubaoTts() {
  const mode = state.voiceTtsMode || 'auto';
  if (mode === 'browser') return false;
  if (mode === 'doubao') return state.ttsDoubaoConfigured;
  return state.ttsEffective === 'doubao';
}

function cycleVoiceTtsMode() {
  const order = state.ttsDoubaoConfigured ? ['doubao', 'auto', 'browser'] : ['auto', 'browser'];
  const i = order.indexOf(state.voiceTtsMode || 'auto');
  setVoiceTtsMode(order[(i + 1) % order.length]);
  toast('朗读：' + (state.voiceTtsMode === 'doubao' ? '豆包' : state.voiceTtsMode === 'browser' ? '浏览器' : '自动'));
}

function speakQuestionBrowser(text) {
  if (!window.speechSynthesis) {
    toast('当前浏览器不支持朗读');
    return;
  }
  if (state.voice.speaking) return;
  stopVoiceListen();
  const u = new SpeechSynthesisUtterance(text || '');
  u.lang = 'zh-CN';
  u.rate = 1;
  state.voice.speaking = true;
  u.onend = function () { state.voice.speaking = false; render(); };
  u.onerror = function () { state.voice.speaking = false; render(); };
  window.speechSynthesis.speak(u);
  render();
}

async function speakQuestion(text) {
  stopVoiceListen();
  if (state.voice.speaking) return;
  if (!shouldUseDoubaoTts()) {
    speakQuestionBrowser(text);
    return;
  }
  state.voice.speaking = true;
  render();
  try {
    const res = await fetch(API_BASE + '/api/voice/tts', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        text: text || '',
        speaker: state.voiceSpeaker || state.ttsDefaultSpeaker || null,
      }),
    });
    if (res.status === 401) {
      clearAuthSession();
      render();
      throw new Error('请先登录');
    }
    if (!res.ok) throw new Error(await res.text());
    // 若用户期间已点了停止，不再继续播
    if (!state.voice.speaking) return;
    const blob = await res.blob();
    stopVoiceSpeak();
    state.voice.speaking = true;
    _voiceAudio = new Audio(URL.createObjectURL(blob));
    _voiceAudio.onended = function () {
      state.voice.speaking = false;
      render();
    };
    _voiceAudio.onerror = function () {
      state.voice.speaking = false;
      toast('豆包朗读播放失败，已切浏览器');
      speakQuestionBrowser(text);
    };
    await _voiceAudio.play();
    render();
  } catch (e) {
    state.voice.speaking = false;
    toast('豆包朗读失败，改用浏览器：' + e.message);
    speakQuestionBrowser(text);
  }
}

function getVoiceSpeechRecognition() {
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  return Ctor || null;
}

function stopVoiceListen() {
  try { if (_voiceRecognition) _voiceRecognition.stop(); } catch (e) {}
  _voiceRecognition = null;
  state.voice.listening = false;
}

function stopVoiceSpeak() {
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  try {
    if (_voiceAudio) {
      _voiceAudio.pause();
      _voiceAudio = null;
    }
  } catch (e2) {}
  state.voice.speaking = false;
}

function toggleVoiceListen() {
  const Ctor = getVoiceSpeechRecognition();
  if (!Ctor) {
    toast('当前浏览器不支持语音识别，请改用打字，或换 Chrome');
    return;
  }
  if (state.voice.listening) {
    stopVoiceListen();
    render();
    return;
  }
  stopVoiceSpeak();
  const rec = new Ctor();
  _voiceRecognition = rec;
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  let finalBuf = state.voice.draft || '';
  rec.onresult = function (ev) {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalBuf += t;
      else interim += t;
    }
    state.voice.draft = (finalBuf + interim).trim();
    render();
  };
  rec.onerror = function (ev) {
    stopVoiceListen();
    toast('语音识别：' + (ev.error || '失败'));
    render();
  };
  rec.onend = function () {
    state.voice.listening = false;
    _voiceRecognition = null;
    render();
  };
  try {
    rec.start();
    state.voice.listening = true;
    toast('正在听…再说完点「停止听写」');
    render();
  } catch (e) {
    toast('无法启动麦克风：' + e.message);
  }
}

function openAddKnowledge(expId, nodeId, manual) {
  if (manual) {
    state.addKnowledgeDraft = {
      id: null, expId: '', nodeId: '',
      question: '', myAnswer: '', referenceAnswer: '',
      tagsStr: '行为面试', note: '', status: '待巩固',
    };
    render();
    return;
  }
  const existing = state.knowledge.find(k => k.source?.expId === expId && k.source?.nodeId === nodeId);
  if (existing) {
    state.addKnowledgeDraft = {
      id: existing.id,
      expId, nodeId,
      question: existing.question,
      myAnswer: existing.myAnswer || '',
      referenceAnswer: existing.referenceAnswer || '',
      tagsStr: (existing.tags || []).join(' · '),
      note: existing.note || '',
      status: existing.status || '待巩固',
    };
  } else {
    const exp = getExpById(expId);
    const n = findNode(exp.qaTree, nodeId);
    const tags = n.knowledgeTags || guessKnowledgeTags(n.question);
    state.addKnowledgeDraft = {
      id: null, expId, nodeId,
      question: n.question,
      myAnswer: n.answer || '',
      referenceAnswer: n.answerMode === 'ai_generated' ? (n.answer || '') : '',
      tagsStr: tags.join(' · '),
      note: '', status: '待巩固',
    };
  }
  render();
}

async function saveKnowledge() {
  const d = state.addKnowledgeDraft;
  const payload = {
    question: document.getElementById('k-q').value.trim(),
    my_answer: document.getElementById('k-my').value.trim(),
    reference_answer: document.getElementById('k-ref').value.trim(),
    tags: document.getElementById('k-tags').value.split(/[·•,，]/).map(s => s.trim()).filter(Boolean),
    note: document.getElementById('k-note').value.trim(),
    status: document.getElementById('k-status').value,
    source_exp_id: d.expId || null,
    source_node_id: d.nodeId || null,
  };
  if (!payload.question) { toast('问题不能为空'); return; }
  try {
    if (d.id) {
      const updated = await api('/api/knowledge/' + d.id, { method: 'PUT', body: JSON.stringify(payload) });
      const mapped = mapKnowledge(updated);
      const i = state.knowledge.findIndex(k => k.id === d.id);
      if (i >= 0) state.knowledge[i] = mapped;
    } else {
      const created = await api('/api/knowledge', { method: 'POST', body: JSON.stringify(payload) });
      state.knowledge.unshift(mapKnowledge(created));
    }
    state.addKnowledgeDraft = null;
    toast('已保存到知识汇总');
    render();
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

          const filterKey = t.parts.slice(0, 2).join(' · ');
          return `<span class="tag clickable" title="在知识汇总中筛选" onclick="event.stopPropagation();go('knowledge','${esc(filterKey)}')">${esc(t.label)} ×${t.count}</span>`;
        }).join('') : '<span class="meta">暂无问答，去文字准备或语音归档练一轮吧</span>'}
      </div>
      <p class="meta" style="margin-top:8px">想背题？把重点题升格到 <button class="btn btn-sm" onclick="go('knowledge')">知识汇总</button></p>
    </div>
    <div class="flex-between" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <h3 style="font-size:15px">追问树 · ${qaCount} 题</h3>
      <div>
        <button class="btn btn-sm" onclick="startNotebookQuiz('${exp.id}')" ${qaCount ? '' : 'disabled'}>🎲 随机提问</button>
        <button class="btn btn-sm" onclick="openConsolidate('${exp.id}')" ${qaCount >= 2 ? '' : 'disabled'}>✨ AI 归纳相似题</button>
        <button class="btn btn-sm btn-danger" onclick="deleteExperience('${exp.id}','notebook')">删除此经历</button>
        <button class="btn btn-primary btn-sm" onclick="go('interview','${exp.id}')">继续准备</button>
      </div>
    </div>
    ${exp.qaTree.length ? renderDetailTree(exp, exp.qaTree, 0) : '<div class="empty">暂无问答记录 · 文字准备会自动写入，语音面试可点 📓 归档</div>'}
  `;
}

function getNotebookQuizPool(expId) {
  const exp = getExpById(expId);
  if (!exp) return [];
  return collectNodes(exp.qaTree).filter(function (n) { return (n.question || '').trim(); });
}

function startNotebookQuiz(expId) {
  const pool = getNotebookQuizPool(expId);
  if (!pool.length) { toast('这道题库里还没有题'); return; }
  const node = pool[Math.floor(Math.random() * pool.length)];
  state.notebookQuiz = { expId, node, revealed: false, answer: '' };
  render();
}

function renderNotebookQuiz() {
  const q = state.notebookQuiz;
  const exp = getExpById(q.expId);
  const node = q.node;
  return `
    <h1 class="page-title">
      <button class="btn btn-ghost btn-sm" onclick="state.notebookQuiz=null;render()">← ${esc(exp ? exp.title : '笔记本')}</button>
      随机提问
    </h1>
    <div class="quiz-card">
      <div class="chip-row" style="margin-bottom:12px">
        ${(node.knowledgeTags || node.labels || []).map(function (t) { return `<span class="tag tag-l1">${esc(t)}</span>`; }).join('')}
        <span class="tag">${esc(node.nodeId)}</span>
      </div>
      <p style="font-size:18px;font-weight:600;line-height:1.5;margin-bottom:16px">${esc(node.question)}</p>
      ${!q.revealed ? `
        <textarea placeholder="先自己答一遍…" oninput="state.notebookQuiz.answer=this.value">${esc(q.answer)}</textarea>
        <button class="btn btn-primary" style="margin-top:12px" onclick="state.notebookQuiz.revealed=true;render()">查看笔记本里的回答 / 点评</button>
      ` : `
        <div class="card" style="background:var(--surface-2)">
          <strong>我刚才的回答</strong>
          <p style="margin-top:6px">${esc(q.answer) || '（未填写）'}</p>
        </div>
        <div class="card">
          <strong>笔记本存档</strong>
          <p style="margin-top:6px">${esc(node.answer) || '（当时未作答）'}</p>
        </div>
        ${node.aiFeedback ? `<div class="card"><strong>AI 点评</strong><p style="margin-top:6px">${esc(node.aiFeedback)}</p>${renderScoreBlock(node)}</div>` : ''}
        <button class="btn" onclick="startNotebookQuiz('${q.expId}')">下一题</button>
        <button class="btn btn-primary" onclick="openAddKnowledge('${q.expId}','${node.nodeId}')">升格到知识汇总</button>
      `}
    </div>`;
}

async function openConsolidate(expId) {
  try {
    showLoading('AI 正在分析相似题…');
    const data = await api('/api/interview/' + expId + '/consolidate', { method: 'POST', body: '{}' });
    hideLoading();
    if (!(data.groups || []).length) {
      toast(data.summary || '未发现可合并的相似题');
      return;
    }
    state.consolidatePreview = {
      expId,
      summary: data.summary || '',
      groups: (data.groups || []).map(function (g) {
        return Object.assign({}, g, { selected: true });
      }),
    };
    render();
  } catch (e) {
    hideLoading();
    toast('分析失败：' + e.message);
    render();
  }
}

function renderConsolidateModal() {
  const p = state.consolidatePreview;
  if (!p) return '';
  return `<div class="modal-bg" onclick="state.consolidatePreview=null;render()">
    <div class="modal" style="max-width:560px" onclick="event.stopPropagation()">
      <h3 style="margin-bottom:8px">AI 归纳相似题</h3>
      <p class="meta" style="margin-bottom:12px">${esc(p.summary)}</p>
      ${(p.groups || []).map(function (g, i) {
        return `<label class="confirm-skip" style="margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:8px;display:block">
          <input type="checkbox" ${g.selected ? 'checked' : ''} onchange="state.consolidatePreview.groups[${i}].selected=this.checked" />
          <strong>${esc(g.canonical_question)}</strong>
          <p class="meta" style="margin-top:4px">合并 ${(g.node_ids || []).join('、')} · ${esc(g.reason || '')}</p>
        </label>`;
      }).join('')}
      <div style="margin-top:12px">
        <button class="btn btn-primary" onclick="applyConsolidate()">应用选中合并</button>
        <button class="btn" onclick="state.consolidatePreview=null;render()">取消</button>
      </div>
    </div>
  </div>`;
}

async function applyConsolidate() {
  const p = state.consolidatePreview;
  if (!p) return;
  const selected = (p.groups || []).filter(function (g) { return g.selected; });
  if (!selected.length) { toast('请至少选一组'); return; }
  try {
    showLoading('正在合并…');
    await api('/api/interview/' + p.expId + '/consolidate/apply', {
      method: 'POST',
      body: JSON.stringify({ groups: selected }),
    });
    const full = await api('/api/experiences/' + p.expId);
    replaceExp(mapExp(full));
    state.consolidatePreview = null;
    hideLoading();
    toast('已合并 ' + selected.length + ' 组相似题');
    render();
  } catch (e) {
    hideLoading();
    toast('合并失败：' + e.message);
    render();
  }
}

function renderDetailTree(exp, tree, depth) {
  return (tree || []).map(n => {
    const inK = state.knowledge.some(k => k.source?.expId === exp.id && k.source?.nodeId === n.nodeId);
    return `
      <div class="notebook-qa" style="margin-left:${depth * 18}px">
        <div><strong>${esc(n.nodeId)}</strong> ${esc(n.question)}</div>
        ${n.answer ? `<div class="meta" style="margin-top:6px">答：${esc(n.answer)}</div>` : ''}
        ${n.aiFeedback ? `<div class="meta" style="margin-top:4px">点评：${esc(n.aiFeedback)}</div>` : ''}
        ${renderScoreBlock(n)}
        <div class="chip-row">
          ${(n.knowledgeTags || n.labels || []).map(t => `<span class="tag tag-l1">${esc(t)}</span>`).join('')}
          ${n.marks.includes('star') ? '<span class="tag">⭐重点</span>' : ''}
          ${n.marks.includes('practice') ? '<span class="tag">✍️待练习</span>' : ''}
        </div>
        <button class="btn btn-sm" onclick="openAddKnowledge('${exp.id}','${n.nodeId}')">${inK ? '编辑知识条目' : '📚 加入知识汇总'}</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTreeNode('${exp.id}','${n.nodeId}')">删除</button>
      </div>
      ${renderDetailTree(exp, n.children, depth + 1)}`;
  }).join('');
}

function openReview() {
  const items = [];
  state.experiences.forEach(exp => {
    collectNodes(exp.qaTree).forEach(n => {
      if (n.marks.includes('practice')) {
        items.push({
          expId: exp.id,
          expTitle: exp.title,
          nodeId: n.nodeId,
          question: n.question,
          oldAnswer: n.answer || '',
          newAnswer: '',
          progress: '',
          stillWeak: '',
        });
      }
    });
  });
  state.reviewItems = items;
  render();
}

function closeReview() {
  state.reviewItems = null;
  render();
}

function renderReviewModal() {
  const items = state.reviewItems || [];
  return `<div class="modal-bg"><div class="modal" onclick="event.stopPropagation()">
    <h3 style="margin-bottom:12px">复习模式 · 待练习（按项目语境）</h3>
    <p class="meta" style="margin-bottom:12px">提交后 AI 会对比上次回答，指出进步与仍可改进处</p>
    ${items.length ? items.map((i, idx) => `<div class="card">
      <small class="meta">${esc(i.expTitle)} · ${esc(i.nodeId)}</small>
      <p><strong>${esc(i.question)}</strong></p>
      <p style="background:var(--surface-2);padding:8px;margin:8px 0;font-size:13px">原答案：${esc(i.oldAnswer || '无')}</p>
      <textarea id="rev-${idx}" placeholder="重新回答…">${esc(i.newAnswer)}</textarea>
      ${i.progress || i.stillWeak ? `
        <div class="feedback" style="margin-top:8px">
          <p><strong>比上次进步：</strong>${esc(i.progress || '—')}</p>
          <p style="margin-top:6px"><strong>还可以更好：</strong>${esc(i.stillWeak || '—')}</p>
        </div>` : ''}
    </div>`).join('') : '<p class="meta">暂无待练习题目。在模拟面试右栏给节点标「待练习」。</p>'}
    <button class="btn btn-primary" onclick="finishReview()">${items.some(i => i.progress) ? '再分析一次' : '提交并请 AI 对比'}</button>
    <button class="btn" onclick="closeReview()">关闭</button>
  </div></div>`;
}

async function finishReview() {
  const items = state.reviewItems || [];
  if (!items.length) { closeReview(); return; }
  items.forEach((i, idx) => {
    const el = document.getElementById('rev-' + idx);
    if (el) i.newAnswer = el.value.trim();
  });
  const todo = items.filter(i => i.newAnswer);
  if (!todo.length) { toast('请至少填写一题再提交'); return; }
  try {
    showLoading('AI 正在对比你和上次的回答…');
    for (const i of todo) {
      const data = await api('/api/interview/' + i.expId + '/review', {
        method: 'POST',
        body: JSON.stringify({ node_id: i.nodeId, new_answer: i.newAnswer }),
      });
      i.progress = data.progress || '';
      i.stillWeak = data.still_weak || '';
    }
    hideLoading();
    render();
    toast('对比完成，请看每题下方点评');
  } catch (e) {
    hideLoading();
    toast('分析失败：' + e.message);
    render();
  }
}

function renderKnowledge() {
  if (state.quiz) return renderQuiz();

  let list = state.knowledge;
  if (state.knowledgeFilter) {
    const f = state.knowledgeFilter;
    list = list.filter(k => (k.tags || []).join(' · ').includes(f) || (k.tags || []).some(t => f.includes(t)));
  }

  const allTagKeys = [...new Set(state.knowledge.map(k => (k.tags || []).slice(0, 2).join(' · ')).filter(Boolean))];

  return `
    <h1 class="page-title">${renderHubBack('review')}知识汇总</h1>
    <p class="page-lead">这里放你精选后要背的卡片。完整练习过程仍在面试笔记本里。</p>
    <div class="tip-box" style="margin-bottom:12px">
      <strong>怎么用</strong>
      <p style="margin:8px 0 0;line-height:1.6">
        从笔记本点「加入知识汇总」就是升格，不是重新录入。适合跨经历随机抽查。
      </p>
    </div>
    <div style="margin-bottom:12px">
      <button class="btn btn-primary" onclick="openAddKnowledge(null,null,true)">＋ 手动添加</button>
      <button class="btn" onclick="startQuiz()">随机提问</button>
      ${state.knowledgeFilter ? `<button class="btn" onclick="state.knowledgeFilter=null;render()">清除筛选：${esc(state.knowledgeFilter)}</button>` : ''}
    </div>
    <div class="chip-row" style="margin-bottom:16px">
      ${allTagKeys.map(t => `<span class="tag clickable ${state.knowledgeFilter===t?'tag-on':''}" onclick="state.knowledgeFilter='${esc(t)}';render()">${esc(t)}</span>`).join('')}
    </div>
    ${list.length === 0 ? '<div class="empty">还没有知识卡片。练过一轮后，可以从笔记本把重点题放进来。</div>' : list.map(k => {
      const exp = k.source ? getExpById(k.source.expId) : null;
      return `
        <div class="card">
          <div class="flex-between">
            <div>
              <span class="status-dot ${k.status==='已掌握'?'ok':'weak'}"></span>
              <strong>${esc(k.question)}</strong>
            </div>
            <div>
              <button class="btn btn-sm" onclick='editKnowledge("${k.id}")'>编辑</button>
              <button class="btn btn-sm btn-danger" onclick="deleteKnowledge('${k.id}')">删除</button>
            </div>
          </div>
          <div class="chip-row" style="margin-top:8px">
            ${(k.tags||[]).map(t => `<span class="tag tag-l1">${esc(t)}</span>`).join('')}
            <span class="tag">${esc(k.status)}</span>
          </div>
          ${k.myAnswer ? `<p class="meta" style="margin-top:8px">我的回答：${esc(k.myAnswer.slice(0,80))}${k.myAnswer.length>80?'…':''}</p>` : ''}
          ${k.note ? `<p class="meta">笔记：${esc(k.note)}</p>` : ''}
          <p class="meta" style="margin-top:6px">来源：${exp ? esc(exp.title) + ' / ' + esc(k.source.nodeId) : '手动添加'} · ${esc(k.addedAt)}</p>
        </div>`;
    }).join('')}`;
}

async function deleteKnowledge(id) {
  const k = state.knowledge.find(function (x) { return x.id === id; });
  if (!k) { toast('条目不存在'); return; }
  const ok = await confirmDelete({
    scope: 'knowledge',
    title: '删除这条知识？',
    body: '将删除「' + (k.question || '').slice(0, 40) + '」，无法恢复。',
    dangerLabel: '确认删除',
  });
  if (!ok) return;
  try {
    await api('/api/knowledge/' + id, { method: 'DELETE' });
    state.knowledge = state.knowledge.filter(function (x) { return x.id !== id; });
    if (state.addKnowledgeDraft && state.addKnowledgeDraft.id === id) state.addKnowledgeDraft = null;
    toast('知识条目已删除');
    render();
  } catch (e) {
    toast('删除失败：' + e.message);
  }
}

function editKnowledge(id) {
  const k = state.knowledge.find(x => x.id === id);
  if (!k) return;
  state.addKnowledgeDraft = {
    id: k.id,
    expId: k.source?.expId || '',
    nodeId: k.source?.nodeId || '',
    question: k.question,
    myAnswer: k.myAnswer || '',
    referenceAnswer: k.referenceAnswer || '',
    tagsStr: (k.tags || []).join(' · '),
    note: k.note || '',
    status: k.status || '待巩固',
  };
  render();
}

function startQuiz() {
  let pool = state.knowledge;
  if (state.knowledgeFilter) {
    const f = state.knowledgeFilter;
    pool = pool.filter(k => (k.tags || []).join(' · ').includes(f));
  }
  if (!pool.length) { toast('没有可抽查的知识条目'); return; }
  const item = pool[Math.floor(Math.random() * pool.length)];
  state.quiz = { item, revealed: false, answer: '' };
  render();
}

function renderQuiz() {
  const { item, revealed, answer } = state.quiz;
  return `
    <h1 class="page-title">
      <button class="btn btn-ghost btn-sm" onclick="state.quiz=null;render()">← 返回知识汇总</button>
      随机提问
    </h1>
    <div class="quiz-card">

      <p style="font-size:18px;font-weight:600;line-height:1.5;margin-bottom:16px">${esc(item.question)}</p>
      ${!revealed ? `
        <textarea placeholder="先自己答一遍…" oninput="state.quiz.answer=this.value">${esc(answer)}</textarea>
        <button class="btn btn-primary" style="margin-top:12px" onclick="state.quiz.revealed=true;render()">查看原答案 / 参考</button>

        <div class="card" style="background:var(--surface-2)">

          <strong>参考答案</strong>
          <p style="margin-top:6px">${esc(item.referenceAnswer) || '（无）'}</p>

        <button class="btn" onclick="state.knowledge.find(k=>k.id==='${item.id}').status='已掌握';toast('已标记掌握');startQuiz()">掌握了，下一题</button>
        <button class="btn btn-primary" onclick="state.knowledge.find(k=>k.id==='${item.id}').status='待巩固';startQuiz()">还要练，下一题</button>

function fillSampleTranscript() {
  const el = document.getElementById('db-transcript');

}

async function saveDebrief() {
  const payload = {
    title: document.getElementById('db-title').value.trim(),
    company: document.getElementById('db-company').value.trim(),
    role: document.getElementById('db-role').value.trim(),
    interview_date: document.getElementById('db-date').value.trim(),
    transcript: document.getElementById('db-transcript').value.trim(),
  };
  if (!payload.transcript) { toast('请粘贴转写文本'); return; }
  try {
    showLoading('保存并提取问答中…');
    const created = await api('/api/debriefs', { method: 'POST', body: JSON.stringify(payload) });
    const extracted = await api('/api/debriefs/' + created.id + '/extract', { method: 'POST', body: '{}' });
    state.debriefs.unshift(extracted);
    state.debriefForm = null;
    hideLoading();
    go('debrief-detail', extracted.id);
    toast('已提取 ' + (extracted.items || []).length + ' 条问答');
  } catch (e) {
    hideLoading();
    toast('失败：' + e.message);
    render();
  }
}

function getDebrief() {
  return (state.debriefs || []).find(d => d.id === state.debriefDetailId);
}

function replaceDebrief(d) {
  const i = state.debriefs.findIndex(x => x.id === d.id);
  if (i >= 0) state.debriefs[i] = d;
  else state.debriefs.unshift(d);
}

function renderDebriefDetail() {

  const scoreSum = debriefScoreSummary(items);
  return `
    <h1 class="page-title">
      <button class="btn btn-ghost btn-sm" onclick="go('debrief')">← 面试经历列表</button>
      ${esc(d.title)}
    </h1>

            <span class="score-num">${scoreSum.avg}</span><span class="meta">/100 本场均分</span>

      const qlabel = it.quality === 'weak' ? '<span class="weak-label">弱答 · 需优化</span>'
        : (it.quality === 'good' ? '<span class="good-label">较好</span>' : '<span class="meta">待分析</span>');

        <div class="card ${qclass}">
          <div class="flex-between">
            <div>${qlabel}${renderDebriefScoreBadge(it)}</div>
            <div>
