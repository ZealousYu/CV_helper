# Render Blueprint：https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: cv-helper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    disk:
      name: cv-helper-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/cv_helper.db
      - key: LLM_PROVIDER
        value: mock
      - key: ACCESS_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # 以下在 Dashboard 里手工填真实密钥，不要提交到 Git
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: DOUBAO_TTS_API_KEY
        sync: false
